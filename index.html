<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gubby Idle</title>
<style>
  :root {
    --bg: #1d1a2b;
    --panel: #2a2640;
    --panel-2: #353052;
    --text: #f1edff;
    --muted: #a59fc4;
    --accent: #7ee0a1;
    --accent-dark: #3fa468;
    --rare: #8fe36a;
    --gold: #ffd166;
    --danger: #ff6b81;
    --header-h: 76px;
  }
  * { box-sizing: border-box; }
  html { font-size: 15px; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    user-select: none;
    overflow: hidden;
  }

  header {
    height: var(--header-h);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 16px;
    background: var(--panel);
    border-bottom: 2px solid var(--panel-2);
  }
  header h1 { margin: 0; font-size: 1.6rem; color: var(--accent); white-space: nowrap; }
  header h1 .mode-tag { display: block; font-size: 0.7rem; font-weight: 600; color: var(--muted); }
  header button { white-space: nowrap; }
  #counters { display: flex; gap: 28px; flex: 1; flex-wrap: wrap; }
  .counter { font-size: 1.3rem; white-space: nowrap; }
  .counter.main b { color: var(--accent); }
  .counter.rare b { color: var(--rare); }
  .counter.rank b { color: #ffd166; }
  .header-buttons { display: flex; gap: 8px; }

  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid #4a4470;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font: inherit;
  }
  button:hover:not(:disabled) { background: #443d68; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button[aria-expanded="true"] { background: #443d68; }

  /* Settings menu: drops down under the header, without dimming the field, so colour changes show live */
  #settings,
  #stats {
    position: fixed;
    top: calc(var(--header-h) - 4px);
    right: 16px;
    z-index: 15;
    width: min(320px, calc(100vw - 32px));
    max-height: calc(100vh - var(--header-h) - 16px);
    overflow-y: auto;
    background: var(--panel);
    border: 2px solid var(--panel-2);
    border-radius: 10px;
    padding: 12px 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  }
  #settings.hidden, #stats.hidden { display: none; }
  #stats h3 { margin: 0 0 8px; font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  html.dyslexic #stats h3 { text-transform: none; letter-spacing: 0.01em; }
  #stats table { width: 100%; border-collapse: collapse; }
  #stats td { padding: 5px 0; border-bottom: 1px solid var(--panel-2); }
  #stats td:last-child { text-align: right; font-weight: 700; color: var(--accent); white-space: nowrap; padding-left: 12px; }
  #stats tr:last-child td { border-bottom: none; }
  #settings h3 { margin: 10px 0 6px; font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  #settings h3:first-child { margin-top: 0; }
  #settings .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  #settings .opt:hover { background: var(--panel-2); }
  #settings .opt input { margin: 3px 0 0; accent-color: var(--accent); cursor: pointer; }
  #settings .opt small { display: block; color: var(--muted); font-size: 0.8rem; }
  #settings .note { margin: 8px 0 0; color: var(--muted); font-size: 0.8rem; }
  html.dyslexic #settings h3 { text-transform: none; letter-spacing: 0.01em; }
  button.danger { border-color: var(--danger); color: var(--danger); }
  button.dev-btn { border-style: dashed; color: var(--muted); }
  button.dev-btn.on { background: #ffb3d9; border-color: #ff6fb5; border-style: solid; color: #2a1020; font-weight: 700; }
  button.rare-btn { border-color: var(--rare); color: var(--rare); }

  main { display: flex; height: calc(100vh - var(--header-h)); }
  #field-wrap { flex: 1; position: relative; min-width: 0; }
  #field { display: block; cursor: none; touch-action: none; position: relative; z-index: 1; }
  #field-wrap .field-bg { position: absolute; left: 0; top: 0; pointer-events: none; }
  #hint {
    z-index: 2;
    position: absolute;
    top: 76px; left: 50%;   /* just below the top path, on the grass */
    transform: translateX(-50%);
    background: rgba(0,0,0,0.45);
    padding: 6px 14px;
    border-radius: 20px;
    pointer-events: none;
    transition: opacity 1s;
    white-space: nowrap;
  }

  #shop {
    width: 440px;
    background: var(--panel);
    padding: 12px;
    overflow-y: auto;
    border-left: 2px solid var(--panel-2);
  }
  #shop h2 { margin: 14px 0 10px; font-size: 1.2rem; color: var(--muted); }
  #news { background: #f3ead6; color: #2b2418; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; font-family: Georgia, "Times New Roman", serif; }
  #news .news-title { font-weight: 700; font-size: 0.8rem; letter-spacing: 0.05em; text-transform: uppercase; border-bottom: 1px solid #2b2418; margin-bottom: 4px; }
  #news-text { font-size: 0.9rem; min-height: 2.6em; transition: opacity 0.4s; }

  /* ---------- Dyslexia-friendly mode (html.dyslexic, see DYSLEXIC in the script) ----------
     OpenDyslexic everywhere, a touch more letter/word/line spacing (per British Dyslexia
     Association guidance), no serif or ALL-CAPS text, and nothing smaller than ~13px. */
  html.dyslexic body,
  html.dyslexic button {
    font-family: 'OpenDyslexic', Verdana, Arial, sans-serif;
    letter-spacing: 0.01em;
    word-spacing: 0.06em;
  }
  html.dyslexic body { line-height: 1.5; }
  html.dyslexic .small { font-size: 0.85rem; }
  html.dyslexic .row-btn .desc,
  html.dyslexic .skill .s-desc,
  html.dyslexic #tree-tip .t-desc { font-size: 0.85rem; line-height: 1.5; }
  html.dyslexic #news { font-family: inherit; background: #fbf5e6; }
  html.dyslexic #news .news-title { text-transform: none; letter-spacing: 0.01em; }
  html.dyslexic #news-text { font-size: 0.9rem; line-height: 1.6; }
  .small { font-size: 0.8rem; color: var(--muted); font-weight: normal; }

  .row-btn {
    width: 100%;
    display: grid;
    grid-template-columns: 52px 1fr auto;
    gap: 8px;
    align-items: center;
    text-align: left;
    padding: 8px;
    margin-bottom: 6px;
  }
  .sheet-icon { display: inline-block; vertical-align: middle; background-repeat: no-repeat; image-rendering: pixelated; }
  .row-btn .icon { font-size: 1.9rem; text-align: center; }
  /* pixel-art icons inline in text, sized to the text around them (sheet set from ITEM_SHEET) */
  .px-icon { display: inline-block; width: 1.25em; height: 1.25em; vertical-align: -0.28em; background-image: var(--items-sheet);
    background-size: var(--items-sheet-size); background-repeat: no-repeat; image-rendering: pixelated; }
  .row-btn .info { display: flex; flex-direction: column; }
  .row-btn .name { font-weight: 600; font-size: 1.05rem; }
  .row-btn .owned { color: var(--accent); margin-left: 4px; }
  .row-btn .desc { font-size: 0.85rem; color: var(--muted); }
  .row-btn .cost { color: var(--accent); white-space: nowrap; font-weight: 700; font-size: 1.1rem; }
  .row-btn.goal { border-color: var(--gold); }
  .row-btn.goal .cost { color: var(--gold); }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 8, 20, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
  }
  .overlay.hidden { display: none; }
  .overlay-panel {
    background: var(--panel);
    border: 2px solid var(--rare);
    border-radius: 12px;
    padding: 16px;
    max-width: 95vw;
    max-height: 95vh;
    display: flex;
    flex-direction: column;
  }
  .overlay-head { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
  .overlay-head h2 { margin: 0; color: var(--rare); }
  .overlay-panel.win { border-color: var(--gold); text-align: center; align-items: center; }
  .overlay-panel.win h2 { color: var(--gold); }

  .row-btn.locked { filter: grayscale(0.8); }

  /* ---------- Skill tree: a pannable board of icon nodes ---------- */
  #skill-overlay { background: none; display: block; }
  #skill-overlay.hidden { display: none; }
  #tree-view {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: #1f78a8;
    background-image:
      radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 24px 24px;
    cursor: grab;
    touch-action: none;
  }
  #tree-view.dragging { cursor: grabbing; }
  #tree-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #tree-lines { position: absolute; overflow: visible; left: 0; top: 0; width: 1px; height: 1px; }
  #tree-lines .edge-bg { stroke: #16384a; stroke-width: 12; stroke-linecap: square; }
  #tree-lines .edge { stroke: #5b5b5b; stroke-width: 6; stroke-linecap: square; }
  #tree-lines .edge.lit { stroke: #eeeeee; }

  .node {
    position: absolute;
    width: 60px; height: 60px;
    margin: -30px 0 0 -30px;
    padding: 0;
    background: #1b1b1b;
    border: 4px solid #6b6b6b;
    border-radius: 9px;
    box-shadow: 0 0 0 3px #111, inset 0 -4px 0 rgba(0,0,0,0.35);
    font-size: 30px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .node:hover:not(:disabled) { background: #262626; }
  /* Border colour = status: grey locked, red can't afford, green can afford, yellow maxed */
  #tree-world:not(.far) .node.island { visibility: hidden; }  /* secret: only seen when zoomed way out */
  .node.locked { border-color: #6b6b6b; background: #151515; cursor: default; font-size: 24px; }
  .node.locked .n-icon { filter: grayscale(1) brightness(0.6); }
  .node.cant-buy { border-color: #e04848; }
  .node.can-buy { border-color: #5ed45e; }
  .node.maxed { border-color: #ffd23f; }
  .node .plus {
    position: absolute;
    right: -10px; bottom: -10px;
    color: #5ed45e;
    font: 900 22px/1 "Segoe UI", sans-serif;
    text-shadow: 0 0 2px #111, 0 0 2px #111, 0 0 3px #111;
    display: none;
  }
  .node.can-buy .plus { display: block; }
  .node .lvl {
    position: absolute;
    left: 50%; top: -12px;
    transform: translateX(-50%);
    font: 700 11px/1 "Segoe UI", sans-serif;
    color: #fff;
    background: #111;
    padding: 2px 5px;
    border-radius: 6px;
    white-space: nowrap;
  }

  #tree-tip {
    position: absolute;
    z-index: 2;
    width: 270px;
    background: #2b2b2b;
    border: 3px solid #111;
    border-radius: 8px;
    padding: 8px 12px 10px;
    pointer-events: none;
    color: #fff;
    text-align: center;
    font-weight: 600;
    box-shadow: 0 6px 0 rgba(0,0,0,0.25);
  }
  #tree-tip.hidden { display: none; }
  #tree-tip .t-head { display: flex; justify-content: center; position: relative; margin-bottom: 6px; }
  #tree-tip .t-name { color: #b7a8ff; }
  #tree-tip .t-lvl { position: absolute; right: 0; color: #ddd; }
  #tree-tip .t-desc { font-size: 0.9rem; line-height: 1.35; }
  #tree-tip .t-cost { margin-top: 6px; color: #ff8fe0; }
  #tree-tip .t-cost.cant { color: #ff6b6b; }

  #tree-hud {
    position: absolute;
    top: 12px; left: 12px; right: 12px;
    display: flex; align-items: center; gap: 14px;
    pointer-events: none;
  }
  #tree-hud > * { pointer-events: auto; }
  #tree-hud .pill {
    background: rgba(17,17,17,0.85);
    border-radius: 8px;
    padding: 6px 12px;
    font-weight: 700;
  }
  #tree-hud .pill b { color: var(--rare); font-size: 1.2rem; }
  #tree-hud .spacer { flex: 1; }

  #toast {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: var(--panel-2);
    border: 1px solid var(--accent);
    padding: 10px 18px;
    border-radius: 8px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 30;
  }
  #toast.show { opacity: 1; }

  @media (max-width: 800px) {
    body { overflow: auto; }
    header { height: auto; flex-wrap: wrap; padding: 8px 12px; }
    main { flex-direction: column; height: auto; }
    #field-wrap { height: 65vh; flex: none; }
    #shop { width: 100%; border-left: none; }
  }
</style>
</head>
<body>
  <header>
    <h1 id="title">Gubby Idle</h1>
    <div id="counters">
      <span class="counter main"><span id="main-icon"></span> <b id="main">0</b></span>
      <span class="counter rare"><span id="rare-icon"></span> <b id="rare">0</b></span>
      <span class="counter"><b id="mps">0</b>/s</span>
      <span class="counter rank" title="Family rank (+5% carrots per rank)"><span id="rank-icon"></span> <b id="rank"></b></span>
    </div>
    <div class="header-buttons">
      <button id="skills-btn" class="rare-btn">Skill Tree (T)</button>
      <button id="dev-btn" class="dev-btn" title="Infinite carrots and clovers while on">Dev Mode: OFF</button>
      <button id="stats-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="stats">Stats</button>
      <button id="settings-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings">Settings</button>
      <button id="save-btn">Save</button>
      <button id="reset-btn" class="danger">Reset</button>
    </div>
  </header>

  <div id="stats" class="hidden" role="dialog" aria-label="Stats">
    <h3>Stats</h3>
    <table><tbody id="stats-rows"></tbody></table>
  </div>

  <div id="settings" class="hidden" role="dialog" aria-label="Settings">
    <h3>Colors</h3>
    <div id="color-modes" role="radiogroup" aria-label="Colorblind mode"></div>
    <h3>Version</h3>
    <label class="opt"><input type="checkbox" id="opt-calm">
      <span>Calm<small>Less motion, for vertigo</small></span></label>
    <label class="opt"><input type="checkbox" id="opt-dyslexic">
      <span>Dyslexia-friendly<small>Easier-to-read font and spacing</small></span></label>
    <p class="note">All versions share the same save. Switching saves your game, then reloads.</p>
  </div>

  <main>
    <div id="field-wrap">
      <canvas id="field"></canvas>
      <div id="hint"></div>
    </div>

    <aside id="shop">
      <div id="news"><div class="news-title" id="news-title"></div><div id="news-text"></div></div>
      <h2><span id="sources-title"></span> <span class="small">(ctrl+click buys max)</span></h2>
      <div id="sources"></div>

      <h2>Upgrades</h2>
      <div id="upgrades"></div>

      <h2>Goal</h2>
      <button id="goal-btn" class="row-btn goal">
        <span class="icon" id="goal-icon"></span>
        <span class="info">
          <span class="name" id="goal-name"></span>
          <span class="desc" id="goal-desc"></span>
        </span>
        <span class="cost" id="goal-cost"></span>
      </button>
    </aside>
  </main>

  <div id="skill-overlay" class="overlay hidden">
    <div id="tree-view">
      <div id="tree-world"><svg id="tree-lines"></svg></div>
    </div>
    <div id="tree-tip" class="hidden"></div>
    <div id="tree-hud">
      <span class="pill"><b id="skill-rare"></b></span>
      <span class="pill small" id="skill-hint"></span>
      <span class="spacer"></span>
      <button id="skills-center">Recenter</button>
      <button id="skills-close">Close (T)</button>
    </div>
  </div>

  <div id="win-overlay" class="overlay hidden">
    <div class="overlay-panel win">
      <h2 id="win-title"></h2>
      <p id="win-text"></p>
      <p id="win-stats"></p>
      <button id="win-close">Keep playing</button>
    </div>
  </div>

  <div id="toast"></div>

<script>
// =====================================================================
// THEME — everything the player sees lives here. Swap names, icons and
// numbers to retheme the game; the engine below doesn't need to change.
// (Current theme is a placeholder: Gubby the bunny eating snacks.)
// =====================================================================

const THEME = {
  saveKey: 'gubbyIdleProto',
  hint: 'Move Gubby over snacks to munch them!',

  main: { name: 'snacks', icon: '🥕' },            // main currency
  rare: { name: 'clovers', icon: '🍀' },           // earned from every snack once unlocked; spent on skills
  // One-time shop purchase that switches the rare currency on (like gum in Garbage Growth).
  rareUnlock: { icon: '🍀', name: 'Lucky Clovers', desc: 'Every snack eaten also gives a clover. Opens the skill tree.', cost: 25 },
  sourcesTitle: 'Snack Sources',
  skillHint: 'Drag to look around · scroll to zoom · click a node to learn it',

  // Sources stand around the grass and toss items into it. `zone` says where:
  //   'path' — the dirt path along the top. `move: 'wander'` strolls back and forth,
  //            `move: 'loop'` rolls across and wraps around from one end to the other.
  //   'bed'  — planted in the garden beds down the left and right sides.
  //   'pad'  — buildings standing still on the concrete pad along the bottom.
  // Each one owned tosses its item every `interval` seconds. `max` caps how many you can own;
  // `fixedMax: true` means no skill can raise that cap.
  // Every source after the first must be unlocked in the skill tree for `unlockCost` rare currency.
  // Optional `sprites`: one emoji/image per unit owned, drawn instead of `icon` around the field.
  // Optional `sheet`: key into SOURCE_SHEETS for animated art, one sheet row per unit owned.
  // Optional `grow`: key into GROW_SHEETS; each plant shows its growth stages and tosses at the last.
  // `item: 'bundle:🥕'` draws a tied bundle of three of that emoji instead of just one.
  sources: [
    { id: 'sprout', icon: '🥕', name: 'Carrot Patch',  desc: 'Grows a carrot, pulls it, plants another.', item: '🥕', value: 1, baseCost: 10, interval: 1.5, max: 25, zone: 'bed',
      grow: 'carrot' },   // steps through the GROW_SHEETS.carrot stages, tossing a carrot at the last one
    { id: 'farmer', icon: '🧑‍🌾', name: 'Mafioso and the Mafialings', desc: 'Tosses bundles of carrots over the fence.', item: 'bundle:🥕', value: 15,   baseCost: 150,   interval: 2.0, max: 5, fixedMax: true, unlockCost: 50, zone: 'path', move: 'wander',
      // Animated sprites from sprites/farmer-sheet.png: the 1st farmer bought uses row 0,
      // the 2nd uses row 1, and so on (see SOURCE_SHEETS below).
      sheet: 'farmer' },
    { id: 'berry',  icon: '🌿', name: 'Strawberry Bush', desc: 'Drops ripe strawberries.',       item: '🍓', value: 30,   baseCost: 2000,  interval: 3.0, max: 25, unlockCost: 200, zone: 'bed' },
    { id: 'cart',   icon: '🛒', name: 'Veggie Cart',   desc: 'Spills lettuce as it rattles by.', item: '🥬', value: 180,  baseCost: 3e4,   interval: 4.0, max: 20, unlockCost: 800, zone: 'path', move: 'loop' },
    { id: 'bakery', icon: '🏪', name: 'Pizzeria',      desc: 'Slings pizza out the door.',       item: '🍕', value: 1200, baseCost: 5e5,   interval: 5.0, max: 20, unlockCost: 3000, zone: 'pad' },
    { id: 'castle', icon: '🏚️', name: 'Abandoned Warehouse', desc: 'Nobody works here. Snacks keep coming out anyway.', item: '🥫', value: 9000, baseCost: 1e7, interval: 6.0, max: 15, unlockCost: 10000, zone: 'pad' },
    { id: 'moon',   icon: '🏢', name: 'Front',         desc: 'A totally legitimate business.',   item: '💼', value: 7e4,  baseCost: 2.5e8, interval: 7.0, max: 15, unlockCost: 30000, zone: 'pad' },
    { id: 'truck',  icon: '🚚', name: "Bootlegger's Truck", desc: 'Smuggles bootleg carrot juice down the path.', item: '🧃', value: 5e5, baseCost: 4e9, interval: 8.0, max: 10, unlockCost: 80000, zone: 'path', move: 'loop', speed: 130 },
    { id: 'casino', icon: '🎰', name: 'Lucky Foot Casino', desc: 'The house always wins. The house is a bunny.', item: '🪙', value: 4e6, baseCost: 6e10, interval: 9.0, max: 10, unlockCost: 250000, zone: 'pad' },
  ],

  upgrades: {
    helper: { icon: '🐰', name: 'Adopt a Baby Gubby', desc: 'Babies hop around eating landed snacks.' },
  },

  // Skill ids are fixed (the engine checks them); names/icons/descs are free.
  // Descriptions describe what ONE level does.
  skills: {
    root:        { icon: '👂', name: "Gubby's Appetite", desc: 'Munch radius +8%' },
    // West: snack value
    value:       { icon: '✨', name: 'Crunchy Snacks',   desc: 'All snacks worth +20%' },
    golden:      { icon: '🌟', name: 'Golden Harvest',   desc: 'Golden snack chance +1%' },
    goldenMult:  { icon: '👑', name: 'Golden Tummy',     desc: 'Golden snacks worth +1x more' },
    dupe:        { icon: '🪞', name: 'Twin Sprouts',     desc: '+5% chance a toss comes in a pair' },
    lifetime:    { icon: '🧊', name: 'Stay Fresh',       desc: 'Landed snacks last +2 seconds' },
    rate:        { icon: '🌻', name: 'Green Thumb',      desc: 'Sources toss 10% faster' },
    rate2:       { icon: '🌷', name: 'Spring Bloom',     desc: 'Sources toss 50% faster' },
    // East: baby gubbies
    helperSpd:   { icon: '💨', name: 'Zoomies',          desc: 'Babies hop 15% faster' },
    helperVal:   { icon: '🍼', name: 'Hungry Babies',    desc: 'Snacks babies eat are worth +25%' },
    helperCap:   { icon: '🏠', name: 'Big Family',       desc: '+5 max Baby Gubbies' },
    helperCost:  { icon: '🏷️', name: 'Adoption Sale',    desc: 'Baby Gubbies cost 10% less' },
    nibble:      { icon: '😋', name: 'Quick Nibbles',    desc: 'Babies eat 15% faster' },

// Calm mode (vertigo friendly): open gubby-calm.html (or index.html?calm). Tones motion
// down: snacks fade in where they land instead of flying across the
// screen, nothing spins, bobs, pulses or blinks, floating numbers don't drift, fairies hold
// still, vehicles move slower, and Binky has no expanding ring.
//
// Dyslexia-friendly mode: open Dyslexic-gubby.html (or index.html?dyslexic). Uses the
// bundled OpenDyslexic font everywhere (falling back to Verdana/Arial), with a
// little extra letter, word and line spacing, and no serif or ALL-CAPS text.
const MODE = new URLSearchParams(location.search);
const CALM = MODE.has('calm');
const DYSLEXIC = MODE.has('dyslexic');
// Every version (normal, calm, dyslexic) shares this one save, so you can switch freely.
const SAVE_KEY = THEME.saveKey;
// Calm/dyslexic used to keep separate saves under these keys; load() adopts one if there's no main save.
const OLD_MODE_SAVE_KEYS = ['Calm', 'Dyslexic', 'CalmDyslexic'].map(m => THEME.saveKey + m);
{
  // The dyslexia-friendly version has its own name; calm mode shows as a tag under the title.
  const name = DYSLEXIC ? 'Dyslexic Gubby' : 'Gubby Idle';
  document.getElementById('title').textContent = name;
  document.title = name;
  const labels = [CALM && 'Calm'].filter(Boolean);
  if (labels.length) {
    document.title = `${name} (${labels.join(', ')})`;
    // Keep the big title short; the mode goes in a small tag underneath it.
    const tag = document.createElement('span');
    tag.className = 'mode-tag';
    tag.textContent = labels.join(' · ');
    document.getElementById('title').appendChild(tag);
  }
}
if (DYSLEXIC) {
  document.documentElement.classList.add('dyslexic');
  // The font ships with the game in fonts/opendyslexic.js (works offline and from file://).
  // If that file is missing, fall back to downloading it from the internet.
  const cdn = (w) => `https://cdn.jsdelivr.net/npm/@fontsource/opendyslexic/files/opendyslexic-latin-${w}-normal.woff2`;
  const useFont = (src) => {
    const style = document.createElement('style');
    style.textContent = [400, 700].map(w =>
      `@font-face { font-family: 'OpenDyslexic'; font-weight: ${w}; font-display: swap; src: url(${src(w)}) format('woff2'); }`).join('\n');
    document.head.appendChild(style);
    // Redraw the cached floating numbers once the font is ready.
    if (document.fonts) document.fonts.load('bold 18px OpenDyslexic').then(() => clearImageCaches()).catch(() => {});
  };
  const script = document.createElement('script');
  script.src = 'fonts/opendyslexic.js';
  script.onload = () => useFont(w => window.OPENDYSLEXIC[w]);
  script.onerror = () => useFont(cdn);
  document.head.appendChild(script);
}

function drawItemIcon(c, name, x, y, size) {
  const [col, row] = ITEM_SHEET.icons[name], n = ITEM_SHEET.size;
  const smooth = c.imageSmoothingEnabled;
  c.imageSmoothingEnabled = false;
  c.drawImage(ITEM_SHEET.img, col * n, row * n, n, n, Math.round(x - size / 2), Math.round(y - size / 2), Math.round(size), Math.round(size));

const ICON_KEYS = Object.keys(EMOJI_ICON).filter(k => !k.startsWith('bundle:')).sort((a, b) => b.length - a.length);
const ICON_RE = new RegExp(ICON_KEYS.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'gu');

const hasIcon = (s) => { ICON_RE.lastIndex = 0; const found = ICON_RE.test(s); ICON_RE.lastIndex = 0; return found; };
// Split text into plain-text runs and icons: [{ text }, { icon }, ...]
function iconRuns(s) {
  const runs = [];
  let at = 0;
  ICON_RE.lastIndex = 0;
  for (const m of s.matchAll(ICON_RE)) {
    if (m.index > at) runs.push({ text: s.slice(at, m.index) });
    runs.push({ icon: EMOJI_ICON[m[0]] });
    at = m.index + m[0].length;
  }
  if (at < s.length) runs.push({ text: s.slice(at) });
  return runs;
}

}

const PLAYER_SCALE = 1.25;
const HELPER_SCALE = 0.75;

// Tiny animation player. An anim is { name: 'idle'|'hop'|'collect', facingRight, idx, t, next }.
// idle and hop loop continuously and switch between each other instantly; a collect
// plays to the end and then moves on to whatever loop was requested (queued in `next`).
function newAnim(name, facingRight) { return { name, facingRight, idx: 0, t: 0, next: null }; }
function animDef(a) { return SPRITE.animations[`${a.name}_${a.facingRight ? 'right' : 'left'}`]; }
function animLength(name) { return SPRITE.animations[name + '_left'].durations.reduce((s, d) => s + d, 0); }

// Ask for a looping animation. Switches immediately, except that a collect
// (one-shot) finishes first and then goes to the requested loop.
function setLoop(a, name) {
  if (a.name === name) { a.next = null; return; }
  if (a.name === 'collect') { a.next = name; return; }
  a.name = name; a.idx = 0; a.t = 0; a.next = null;
}
// Play a one-shot animation (collect). Does nothing if it's already playing.
function playOnce(a, name) {
  if (a.name === name) return;
  a.next = a.next || a.name;
  a.name = name; a.idx = 0; a.t = 0;
}
function stepAnim(a, dt) {
  a.t += dt * 1000;
  let def = animDef(a);
  while (a.t >= def.durations[a.idx]) {
    a.t -= def.durations[a.idx];
    a.idx++;
    if (a.idx >= def.frames.length) {
      a.idx = 0;
      if (a.next || a.name === 'collect') { a.name = a.next || 'idle'; a.next = null; def = animDef(a); }
    }
  }
}

function perSecond() {
  const now = performance.now();
  while (earnLog.length && now - earnLog[0][0] > 5000) earnLog.shift();
  return earnLog.reduce((s, e) => s + e[1], 0) / 5;
}

const SUFFIXES = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmt(n) {
  if (n < 1000) return n < 10 && n % 1 !== 0 ? n.toFixed(1) : Math.floor(n).toString();
  const tier = Math.floor(Math.log10(n) / 3);
  if (tier >= SUFFIXES.length) return n.toExponential(2);
  return (n / Math.pow(1000, tier)).toFixed(2) + SUFFIXES[tier];
}
const cur = (n) => THEME.main.icon + fmt(n);

function fmtTime(seconds) {
  seconds = Math.floor(seconds);
  const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60), s = seconds % 60;
  if (h) return `${h}h ${m}m`;
  if (m) return `${m}m ${s}s`;
  return `${s}s`;
}

const $ = (id) => document.getElementById(id);
const canvas = $('field');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;

const sheet = new Image();
sheet.src = SHEET_SRC;
cbTrack(SHEET_SRC, (url) => { sheet.src = url; });

// Render scale is capped: high-DPI screens (common on Chromebooks) would otherwise
// make the canvas 2-4x more pixels to fill every frame.
const MAX_DPR = 1.5;
let DPR = 1;

function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
  if (dpr !== DPR && typeof clearImageCaches === 'function') clearImageCaches();   // cached images were made for the old density
  DPR = dpr;
  W = r.width; H = r.height;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layoutField();
  layoutGen++;  // fixed unit spots (beds, pad) must be recomputed
  bgKey = ''; // background cache must be rebuilt at the new size
}

const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;

// Deterministic 0..1 hash so sources and decorations keep stable spots.
function hash(n) {
  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

const SPRITES_PER_TYPE = 5;

// Field layout: a dirt path across the top, garden beds down both sides, a concrete
// pad across the bottom, and the grass in the middle (where snacks land).
const LAYOUT = { path: 64, bed: 60, pad: 76 };
const GRASS = { x0: 0, y0: 0, x1: 0, y1: 0 };   // recomputed on resize
function layoutField() {
  GRASS.x0 = LAYOUT.bed; GRASS.x1 = W - LAYOUT.bed;
  GRASS.y0 = LAYOUT.path; GRASS.y1 = H - LAYOUT.pad;
}
const randGrassX = (m = 20) => rand(GRASS.x0 + m, GRASS.x1 - m);
const randGrassY = (m = 20) => rand(GRASS.y0 + m, GRASS.y1 - m);

const BED_TYPES = SOURCES.filter(s => s.zone === 'bed').map(s => s.id);
const PAD_TYPES = SOURCES.filter(s => s.zone === 'pad').map(s => s.id);
const PATH_TYPES = SOURCES.filter(s => s.zone === 'path').map(s => s.id);

// Where unit k of source s stands right now. Beds and the pad never move, so those spots are worked out
// once per layout; path walkers update one reused object. (Callers read x/y straight away and never keep
// the object, so reusing it is safe.)
let layoutGen = 0;
const _pathPos = { x: 0, y: 0 };
function unitPos(s, k) {
  if (s.zone === 'path') {
    const m = movers[s.id] && movers[s.id][k];
    _pathPos.x = m ? m.x : W / 2; _pathPos.y = LAYOUT.path / 2;
    return _pathPos;
  }
  if (s._posGen !== layoutGen) { s._pos = []; s._posGen = layoutGen; }
  return s._pos[k] || (s._pos[k] = fixedUnitPos(s, k));
}
// Garden bed plants each get a random spot when they first appear (i.e. when bought). Spots are
// stored in the save as fractions of the bed (side 0 = left / 1 = right, u = across, v = down)
// so they stay put across reloads and window sizes. New spots keep a little distance from
// existing plants so they don't stack exactly on top of each other.
function bedSpotPos(spot) {
  const x = (spot.side ? W - LAYOUT.bed : 0) + LAYOUT.bed * spot.u;
  const y = GRASS.y0 + 50 + (GRASS.y1 - GRASS.y0 - 60) * spot.v;   // room above for tall plants
  return { x, y };
}
function newBedSpot() {
  const taken = [];
  for (const id of BED_TYPES) for (const sp of (state.bedSpots[id] || [])) taken.push(bedSpotPos(sp));
  let best = null, bestGap = -1;
  for (let tries = 0; tries < 24; tries++) {
    const spot = { side: Math.random() < 0.5 ? 0 : 1, u: rand(0.3, 0.7), v: Math.random() };
    const p = bedSpotPos(spot);
    let gap = Infinity;
    for (const q of taken) gap = Math.min(gap, Math.hypot(p.x - q.x, p.y - q.y));
    if (gap > bestGap) { best = spot; bestGap = gap; }
    if (gap >= 40) break;   // roomy enough
  }
  return best;
}
function bedSpot(s, k) {
  const spots = state.bedSpots[s.id] || (state.bedSpots[s.id] = []);
  while (spots.length <= k) spots.push(newBedSpot());
  return spots[k];
}

function fixedUnitPos(s, k) {
  if (s.zone === 'bed') return bedSpotPos(bedSpot(s, k));
  // pad: each building type gets its own stretch of the pad, units spaced evenly in it
  const p = PAD_TYPES.indexOf(s.id);
  const seg = W / PAD_TYPES.length;
  return { x: seg * p + seg * (k + 0.5) / SPRITES_PER_TYPE, y: H - LAYOUT.pad / 2 };
}

// Path walkers, per source: farmers wander back and forth; carts roll right and wrap around.
const movers = {};
function updateMovers(dt) {
  for (const s of SOURCES) {
    if (s.zone !== 'path') continue;
    const arr = movers[s.id] || (movers[s.id] = []);
    const n = spritesShown(s);
    while (arr.length < n) {
      arr.push({ x: rand(40, W - 40), tx: rand(40, W - 40), wait: rand(0, 2), facingRight: Math.random() < 0.5, speed: (s.speed ? rand(s.speed * 0.9, s.speed * 1.1) : rand(55, 85)) * (CALM ? 0.5 : 1) });
    }
    arr.length = n;
    for (let k = 0; k < arr.length; k++) {
      const m = arr[k];
      if (CALM) {
        // Calm: everyone on the path stands still in an evenly spaced spot of their own.
        const slots = PATH_TYPES.length * SPRITES_PER_TYPE;
        const slot = PATH_TYPES.indexOf(s.id) + k * PATH_TYPES.length;
        m.x = 40 + (W - 80) * (slot + 0.5) / slots;
        m.moving = false;
        continue;
      }
      if (s.move === 'loop') {
        m.x += m.speed * dt;
        m.facingRight = true;
        m.moving = true;
        if (m.x > W + 40) m.x = -40;          // off the right end, back in on the left
      } else {
        if (m.wait > 0) { m.wait -= dt; m.moving = false; continue; }
        const d = m.tx - m.x;
        if (Math.abs(d) < 2) {                 // arrived: hang around, then pick a new spot
          m.wait = rand(1, 4);
          m.tx = Math.min(W - 40, Math.max(40, m.x + rand(-250, 250)));
          m.moving = false;
          continue;
        }
        m.x += Math.sign(d) * Math.min(Math.abs(d), 40 * dt);
        m.facingRight = d > 0;
        m.moving = true;
      }
    }
  }
}
// Planted sources (`grow`): each visible plant steps through its growth stages and tosses
// when a cycle completes, then starts again from bare dirt. With more owned than shown,
// each visible plant's harvest is a bundle covering the extras, so income is unchanged.
const growth = {};   // source id -> per-plant progress through the current cycle (0..1)
function growPlants(s, typeIndex, dt, count) {
  const shown = spritesShown(s);
  const arr = growth[s.id] || (growth[s.id] = []);
  while (arr.length < shown) arr.push(Math.random());   // new plants start at different stages
  arr.length = shown;
  const cyclesPerSec = tossMult() / s.interval;
  for (let k = 0; k < shown; k++) {
    arr[k] += dt * cyclesPerSec;
    if (arr[k] >= 1) { arr[k] -= 1; tossItem(s, typeIndex, count / shown, k); }
  }
}
function growStage(s, k) {
  const n = GROW_SHEETS[s.grow].frames.length;
  const p = (growth[s.id] && growth[s.id][k]) || 0;
  return Math.min(n - 1, Math.floor(p * n));
}
// Draws one growth stage with its bottom (the dirt mound) at feetY.
function drawGrowSprite(g, stage, x, feetY) {
  if (!g.img.complete || !g.img.naturalWidth) return;
  const f = g.frames[stage];
  const w = f.w * g.scale, h = f.h * g.scale;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(g.img, f.x, f.y, f.w, f.h, Math.round(x - w / 2), Math.round(feetY - h), w, h);
  ctx.imageSmoothingEnabled = true;
}

const unitFacingRight = (s, k) => !!(movers[s.id] && movers[s.id][k] && movers[s.id][k].facingRight);
// path walkers only animate their walk while actually moving; everything else always animates
const unitMoving = (s, k) => s.zone !== 'path' || !!(movers[s.id] && movers[s.id][k] && movers[s.id][k].moving);

const TUFTS = Array.from({ length: 80 }, (_, i) => ({ u: hash(i + 300), v: hash(i + 400) }));

// How many of a source are drawn around the edge: one per owned unit, up to its
// own sprite list (or SPRITES_PER_TYPE copies of its icon).
const spritesShown = (s) => Math.min(state.owned[s.id],
  s.sheet ? SOURCE_SHEETS[s.sheet].rows : s.sprites ? s.sprites.length : SPRITES_PER_TYPE);

// Draws unit `k` of a sheet-based source: row k of the sheet, playing its idle loop.
// Each unit starts at a different frame so they don't all breathe in sync.
// The art faces left; `flip` mirrors it to face right.
function drawSheetSprite(sh, k, x, y, now, flip = false, moving = true) {
  if (!sh.img.complete || !sh.img.naturalWidth) return;
  const f = moving ? (Math.floor(now / sh.ms) + k * 3) % sh.frames : (sh.standFrame || 0);
  const w = sh.frameWidth * sh.scale, h = sh.frameHeight * sh.scale;
  ctx.imageSmoothingEnabled = sh.scale < 1;
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(sh.img, f * sh.frameWidth, k * sh.frameHeight, sh.frameWidth, sh.frameHeight,
    Math.round(-w / 2), Math.round(-h / 2), Math.round(w), Math.round(h));
  ctx.restore();
  ctx.imageSmoothingEnabled = true;
}

function tossItem(s, typeIndex, bundle, k = Math.floor(Math.random() * spritesShown(s))) {
  const src = unitPos(s, k);
  lastToss[s.id + k] = performance.now();
  const golden = Math.random() < goldenChance();
  const value = s.value * valueMult() * sourceValMult(s) * bundle * (golden ? goldenMult() : 1);
  const size = Math.round(26 + Math.min(12, Math.log2(bundle) * 2));
  const clovers = cloversPerSnack(s.id) * bundle;

  spawnItem(src, { kind: 'main', icon: s.item, value, clovers, golden, size });
  if (Math.random() < dupeChance()) spawnItem(src, { kind: 'main', icon: s.item, value, clovers, golden: false, size });
}

function spawnItem(src, props) {
  // Field is full: fold this toss's value and clovers into a random snack already out
  // there, so nothing is lost but the item count (and the lag) stays capped.
  // Event drops (`force`) always get their own item.
  if (items.length >= MAX_ITEMS && !props.force) {
    const host = items[Math.floor(Math.random() * items.length)];
    if (!host.dead) {
      host.value += props.value;
      host.clovers += props.clovers;
      host.golden = host.golden || props.golden;
      host.size = Math.min(44, host.size + 1);
      return;
    }
  }
  // props may override the landing spot (tx/ty), flight time and arc height.
  const it = {
    tx: randGrassX(), ty: randGrassY(),
    flight: rand(0.7, 1.2), arc: rand(60, 140),
    ...props,
    sx: src.x, sy: src.y,
    x: src.x, y: src.y,
    t: 0,
    rot: 0, vr: rand(-8, 8),
    landed: false, age: 0, dead: false, claimed: null,
  };
  if (CALM) {
    // No flying or spinning: the snack starts at its landing spot and fades in there.
    it.sx = it.x = it.tx;
    it.sy = it.y = it.ty;
    it.arc = 0; it.vr = 0; it.flight = 0.35;
  }
  items.push(it);
  if (items.length > MAX_ITEMS + 20) items.shift().dead = true; // hard ceiling, just in case
}

// `by` is who ate it: 'player', 'helper', 'orbiter' (fairy). For helpers, `baby` is the
// baby itself, so its variant can boost the snack (see BABY_KINDS).
function collect(it, by, baby) {
  if (it.dead) return;
  it.dead = true;
  const kind = baby ? BABY_KINDS[baby.kind] : null;
  let v = it.value;
  if (by === 'helper') v *= helperValMult() * (kind ? kind.value : 1);
  if (by === 'player') v *= 1 + 0.15 * lvl('gourmet');      // Gourmet Gubby
  if (by === 'orbiter') v *= 1 + lvl('fairyQueen');         // Fairy Queen
  const jackpot = Math.random() < 0.01 * lvl('jackpot');    // Jackpot: x10
  if (jackpot) v *= 10;
  state.main += v;
  state.totalEarned += v;
  state.collected++;
  earnLog.push([performance.now(), v]);
  const important = it.golden || jackpot || by !== 'helper';
  addFloat('+' + fmt(v) + (jackpot ? ' 🎰x10' : ''), it.x, it.y, it.golden || jackpot ? '#ffd166' : '#ffffff', important);

  // Once unlocked, every snack also gives clovers (like gum in Garbage Growth).
  if (state.cloversUnlocked) {
    let c = it.clovers;
    if (by === 'helper') c *= (1 + 0.5 * lvl('sniffers')) * (kind ? kind.clover : 1);
    if (it.golden) c += 25 * lvl('cloverRain');
    const lucky = Math.random() < rabbitsFootChance();   // Rabbit's Foot jackpot
    if (lucky) c *= 10;
    c = Math.max(1, Math.round(c));
    state.rare += c;
    state.totalRare += c;
    addFloat(`+${fmt(c)} ${THEME.rare.icon}${lucky ? ' 🐾x10' : ''}`, it.x, it.y + 18, '#8fe36a', important || lucky);
  }
}

// Floating numbers are capped so a busy field stays readable and cheap to draw: minor ones (babies'
// munches) stop at 30 on screen; important ones always show, dropping the oldest past 60.
const MAX_MINOR_FLOATS = 30, MAX_FLOATS = 60;
function addFloat(text, x, y, color, important) {
  if (!important && floats.length >= MAX_MINOR_FLOATS) return;
  floats.push({ text, x, y, color, life: 1, img: undefined, imgGen: -1 });
  if (floats.length > MAX_FLOATS) floats.shift();
}

// Keep the robot well inside the grass (GRASS is set by layoutField).
const GRASS_PAD = 40;
const ROBOT_TRIP = 250;            // max distance per stroll (~5s of walking)
const ROBOT_IDLE = [3, 10];        // seconds he stands around between strolls

// Next spot: a short trip from where he is, kept on the grass.
function pickRobotSpot() {
  const ang = rand(0, Math.PI * 2), dist = rand(60, ROBOT_TRIP);
  robot.tx = Math.min(GRASS.x1 - GRASS_PAD, Math.max(GRASS.x0 + GRASS_PAD, robot.x + Math.cos(ang) * dist));
  robot.ty = Math.min(GRASS.y1 - GRASS_PAD, Math.max(GRASS.y0 + GRASS_PAD + 30, robot.y + Math.sin(ang) * dist));
}

function updateRobot(dt) {
  if (!W || !H) return;
  if (!robot.placed) {
    robot.x = W / 2; robot.y = H / 2;
    robot.wait = rand(...ROBOT_IDLE);  // starts out just standing there
    pickRobotSpot();
    robot.placed = true;
  }
  if (CALM) { robot.moving = false; return; }   // calm: Bonder stands still where he arrived
  if (robot.wait > 0) { robot.wait -= dt; robot.moving = false; return; }
  const dx = robot.tx - robot.x, dy = robot.ty - robot.y, d = Math.hypot(dx, dy);
  if (d < 2) {
    robot.wait = rand(...ROBOT_IDLE);  // idle for a while, then wander somewhere nearby
    pickRobotSpot();
    robot.moving = false;
    return;
  }
  const step = Math.min(d, 45 * dt);  // a slow, aimless stroll
  robot.x += (dx / d) * step;
  robot.y += (dy / d) * step;
  if (Math.abs(dx) > 0.5) robot.facingRight = dx > 0;
  robot.moving = true;
}

// Baby Gubby variants. 'normal' are the bought ones (+ Fluffle); each other kind comes from its
// baby_<kind> skill, one baby per level. speed/value/clover multiply that baby's stats; eatsGolden
// lets it eat golden snacks; midair lets it grab snacks still flying; chomp eats every snack within
// that many px of its target too. Looks: tint washes the sprite in a colour, hat is an emoji worn
// on top, alpha makes it see-through, scale changes its size. `sheet` can name a custom sprite
// sheet (same layout as gubby-sheet.png) once there's art for that baby; until then it's tinted.
const BABY_KINDS = {
  normal: { speed: 1,   value: 1,   clover: 1 },
  golden: { speed: 1,   value: 3,   clover: 1, eatsGolden: true, tint: '#ffcf40' },
  ninja:  { speed: 2,   value: 1,   clover: 1, tint: '#3a3550' },
  lucky:  { speed: 1,   value: 1,   clover: 3, tint: '#57d957' },
  chonk:  { speed: 0.8, value: 1,   clover: 1, chomp: 50, scale: 1.0 },
  mob:    { speed: 1,   value: 1.5, clover: 1, eatsGolden: true, hat: '🎩' },
  ghost:  { speed: 1.2, value: 1,   clover: 1, midair: true, alpha: 0.55, tint: '#cfe8ff' },
};
// Each kind's own sprite sheet (the Mob Baby wears Don Gubby's fedora); the tint only shows until it loads.
for (const kind of ['golden', 'ninja', 'lucky', 'chonk', 'ghost']) BABY_KINDS[kind].sheet = GUBBY_ART[kind].img;
BABY_KINDS.mob.sheet = GUBBY_ART.don.img;

// Tinted copies of the Gubby sheet, made once per colour (cheap to draw after that).
const tintedSheets = new Map();
function babySheet(kind) {
  const K = BABY_KINDS[kind];
  if (K.sheet && K.sheet.complete && K.sheet.naturalWidth) return K.sheet;
  if (!K.tint || !sheet.complete || !sheet.naturalWidth) return sheet;
  let c = tintedSheets.get(K.tint);
  if (!c) {
    c = document.createElement('canvas');
    c.width = sheet.naturalWidth; c.height = sheet.naturalHeight;
    const g = c.getContext('2d');
    g.drawImage(sheet, 0, 0);
    g.globalCompositeOperation = 'source-atop';   // only colour the bunny, not the transparent space
    g.globalAlpha = 0.5;
    g.fillStyle = K.tint;
    g.fillRect(0, 0, c.width, c.height);
    tintedSheets.set(K.tint, c);
  }
  return c;
}

// Keeps the helpers array matching what's owned. Only re-checks when something that changes
// the count happens (helperDirty), so it costs nothing on ordinary frames.
let helperDirty = true;
const helperWant = {}, helperHave = {};
function syncHelpers() {
  if (!helperDirty) return;
  if (!W || !H) return; // field not laid out yet; spawning now would pile them in the corner
  helperDirty = false;
  for (const kind in BABY_KINDS) {
    helperWant[kind] = kind === 'normal'
      ? state.levels.helper + 2 * lvl('fluffle')   // bought + free ones from Fluffle
      : lvl('baby_' + kind);
    helperHave[kind] = 0;
  }
  for (const h of helpers) helperHave[h.kind]++;
  for (let i = helpers.length - 1; i >= 0; i--) {   // too many of a kind (e.g. after a reset)
    const h = helpers[i];
    if (helperHave[h.kind] > helperWant[h.kind]) { helperHave[h.kind]--; helpers.splice(i, 1); }
  }
  for (const kind in BABY_KINDS) {
    while (helperHave[kind] < helperWant[kind]) {
      helpers.push({ kind, x: W / 2 + rand(-60, 60), y: H / 2 + rand(-60, 60), target: null, cd: 0,
                     facingRight: Math.random() < 0.5, moving: false, anim: newAnim('idle', true), wander: null });
      helperHave[kind]++;
    }
  }
}
