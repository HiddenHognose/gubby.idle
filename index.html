let state = freshState();

// Live (unsaved) world entities
let items = [];
let helpers = [];
let floats = [];
const tossAcc = {};
const lastToss = {};
const earnLog = [];
const mouse = { x: 0, y: 0, inside: false };
const player = { facingRight: true, moving: false, anim: newAnim('idle', true), lastX: 0, lastY: 0, moveTimer: 0 };
let orbitAngle = 0;
// The robot: strolls between random spots on the grass, pausing now and then.
const robot = { x: 0, y: 0, tx: 0, ty: 0, wait: 0, moving: false, placed: false, facingRight: true };

function lvl(id) { return state.skills[id] || 0; }

// =====================================================================
// Derived stats
// =====================================================================

const munchRadius    = () => (38 + 8 * lvl('appetite')) * (1 + 0.08 * lvl('root'));
const valueMult      = () => (1 + 0.25 * lvl('tasty')) * (1 + 0.2 * lvl('value')) * (1 + THEME.rankBonus * rankIndex());
const sourceValMult  = (s) => (1 + 0.5 * lvl(s.id + '_val')) * (itemEmoji(s) === '🥕' ? 1 + 0.3 * lvl('connoisseur') : 1);
const sourceDiscount = () => 1 - 0.04 * lvl('refuse');       // An Offer You Can't Refuse
const binkyEvery     = () => [0, 15, 11, 8][lvl('binky')] || 0; // seconds between binkies (0 = never)
const rabbitsFootChance = () => 0.02 * lvl('rabbitsFoot');

// Family rank, from total carrots ever earned
function rankIndex() {
  let r = 0;
  for (let i = 0; i < THEME.ranks.length; i++) if (state.totalEarned >= THEME.ranks[i].at) r = i;
  return r;
}
const sourceMax      = (s) => s.fixedMax ? s.max : s.max + 5 * lvl(s.id + '_cap');
const tossMult       = () => (1 + 0.1 * lvl('rate')) * Math.pow(1.5, lvl('rate2'));
// Clovers per snack eaten: 1 base, +1 per Four-Leaf Luck and per "Lucky <source>" level, x1.5 per Clover Charm.
const cloversPerSnack = (sourceId) => (1 + lvl('rareChance') + lvl(sourceId + '_clover')) * Math.pow(1.5, lvl('rareValue')) * (1 + 0.2 * lvl('hushMoney'));
const goldenChance   = () => BASE_GOLDEN_CHANCE + 0.01 * lvl('golden');
const goldenMult     = () => 2 + lvl('goldenMult');               // golden snacks: 2x, +1x per Golden Tummy level
const dupeChance     = () => 0.05 * lvl('dupe');
const itemLifetime   = () => ITEM_LIFETIME + 2 * lvl('lifetime');
const helperSpeed    = () => 110 * (1 + 0.15 * lvl('helperSpd'));
const helperValMult  = () => 1 + 0.25 * lvl('helperVal');
const helperEatTime  = () => 1 - 0.15 * lvl('nibble');      // fraction of the normal eating pause
const orbiterCount   = () => lvl('fairy');
const fairySpeed     = () => 2.2 * (1 + 0.25 * lvl('fairyDust'));
const fairyReach     = () => 30 * (1 + 0.2 * lvl('fairyDust'));
const magnetRange    = () => 50 * lvl('magnet');

function sourceCost(s, n = 1) {
  const r = SOURCE_GROWTH;
  return s.baseCost * sourceDiscount() * Math.pow(r, state.owned[s.id]) * (Math.pow(r, n) - 1) / (r - 1);
}
function sourceMaxAffordable(s) {
  const r = SOURCE_GROWTH;
  const first = s.baseCost * sourceDiscount() * Math.pow(r, state.owned[s.id]);
  return Math.max(0, Math.floor(Math.log(state.main * (r - 1) / first + 1) / Math.log(r)));
}

function perSecond() {
  const now = performance.now();
  while (earnLog.length && now - earnLog[0][0] > 5000) earnLog.shift();
  return earnLog.reduce((s, e) => s + e[1], 0) / 5;
}

// =====================================================================
// Formatting
// =====================================================================

const SUFFIXES = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmt(n) {
  if (n < 1000) return n < 10 && n % 1 !== 0 ? n.toFixed(1) : Math.floor(n).toString();
  const tier = Math.floor(Math.log10(n) / 3);
  if (tier >= SUFFIXES.length) return n.toExponential(2);
  return (n / Math.pow(1000, tier)).toFixed(2) + SUFFIXES[tier];
}
const cur = (n) => THEME.main.icon + fmt(n);

function fmtTime(seconds) {
  seconds = Math.floor(seconds);
  const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60), s = seconds % 60;
  if (h) return `${h}h ${m}m`;
  if (m) return `${m}m ${s}s`;
  return `${s}s`;
}

// =====================================================================
// Canvas / world
// =====================================================================

const $ = (id) => document.getElementById(id);
const canvas = $('field');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;

const sheet = new Image();
sheet.src = SHEET_SRC;
cbTrack(SHEET_SRC, (url) => { sheet.src = url; });

// Render scale is capped: high-DPI screens (common on Chromebooks) would otherwise
// make the canvas 2-4x more pixels to fill every frame.
const MAX_DPR = 1.5;
let DPR = 1;

function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
  if (dpr !== DPR && typeof clearImageCaches === 'function') clearImageCaches();   // cached images were made for the old density
  DPR = dpr;
  W = r.width; H = r.height;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layoutField();
  layoutGen++;  // fixed unit spots (beds, pad) must be recomputed
  bgKey = ''; // background cache must be rebuilt at the new size
}

const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;

// Deterministic 0..1 hash so sources and decorations keep stable spots.
function hash(n) {
  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

const SPRITES_PER_TYPE = 5;

// Field layout: a dirt path across the top, garden beds down both sides, a concrete
// pad across the bottom, and the grass in the middle (where snacks land).
const LAYOUT = { path: 64, bed: 60, pad: 76 };
const GRASS = { x0: 0, y0: 0, x1: 0, y1: 0 };   // recomputed on resize
function layoutField() {
  GRASS.x0 = LAYOUT.bed; GRASS.x1 = W - LAYOUT.bed;
  GRASS.y0 = LAYOUT.path; GRASS.y1 = H - LAYOUT.pad;
}
const randGrassX = (m = 20) => rand(GRASS.x0 + m, GRASS.x1 - m);
const randGrassY = (m = 20) => rand(GRASS.y0 + m, GRASS.y1 - m);

const BED_TYPES = SOURCES.filter(s => s.zone === 'bed').map(s => s.id);
const PAD_TYPES = SOURCES.filter(s => s.zone === 'pad').map(s => s.id);

// Where unit k of source s stands right now. Beds and the pad never move, so those spots are worked out
// once per layout; path walkers update one reused object. (Callers read x/y straight away and never keep
// the object, so reusing it is safe.)
let layoutGen = 0;
const _pathPos = { x: 0, y: 0 };
function unitPos(s, k) {
  if (s.zone === 'path') {
    const m = movers[s.id] && movers[s.id][k];
    _pathPos.x = m ? m.x : W / 2; _pathPos.y = LAYOUT.path / 2;
    return _pathPos;
  }
  if (s._posGen !== layoutGen) { s._pos = []; s._posGen = layoutGen; }
  return s._pos[k] || (s._pos[k] = fixedUnitPos(s, k));
}
function fixedUnitPos(s, k) {
  if (s.zone === 'bed') {
    // Units alternate left/right bed; plant types interleave down the rows.
    const p = BED_TYPES.indexOf(s.id);
    const rows = Math.ceil(SPRITES_PER_TYPE / 2) * BED_TYPES.length;
    const row = Math.floor(k / 2) * BED_TYPES.length + p;
    const top = GRASS.y0 + 28, span = GRASS.y1 - GRASS.y0 - 56;
    return { x: k % 2 ? W - LAYOUT.bed / 2 : LAYOUT.bed / 2, y: top + span * row / Math.max(1, rows - 1) };
  }
  // pad: each building type gets its own stretch of the pad, units spaced evenly in it
  const p = PAD_TYPES.indexOf(s.id);
  const seg = W / PAD_TYPES.length;
  return { x: seg * p + seg * (k + 0.5) / SPRITES_PER_TYPE, y: H - LAYOUT.pad / 2 };
}

// Path walkers, per source: farmers wander back and forth; carts roll right and wrap around.
const movers = {};
function updateMovers(dt) {
  for (const s of SOURCES) {
    if (s.zone !== 'path') continue;
    const arr = movers[s.id] || (movers[s.id] = []);
    const n = spritesShown(s);
    while (arr.length < n) {
      arr.push({ x: rand(40, W - 40), tx: rand(40, W - 40), wait: rand(0, 2), facingRight: Math.random() < 0.5, speed: (s.speed ? rand(s.speed * 0.9, s.speed * 1.1) : rand(55, 85)) * (CALM ? 0.5 : 1) });
    }
    arr.length = n;
    for (const m of arr) {
      if (s.move === 'loop') {
        m.x += m.speed * dt;
        m.facingRight = true;
        m.moving = true;
        if (m.x > W + 40) m.x = -40;          // off the right end, back in on the left
      } else {
        if (m.wait > 0) { m.wait -= dt; m.moving = false; continue; }
        const d = m.tx - m.x;
        if (Math.abs(d) < 2) {                 // arrived: hang around, then pick a new spot
          m.wait = rand(1, 4);
          m.tx = Math.min(W - 40, Math.max(40, m.x + rand(-250, 250)));
          m.moving = false;
          continue;
        }
        m.x += Math.sign(d) * Math.min(Math.abs(d), 40 * dt);
        m.facingRight = d > 0;
        m.moving = true;
      }
    }
  }
}
// Planted sources (`grow`): each visible plant steps through its growth stages and tosses
// when a cycle completes, then starts again from bare dirt. With more owned than shown,
// each visible plant's harvest is a bundle covering the extras, so income is unchanged.
const growth = {};   // source id -> per-plant progress through the current cycle (0..1)
function growPlants(s, typeIndex, dt, count) {
  const shown = spritesShown(s);
  const arr = growth[s.id] || (growth[s.id] = []);
  while (arr.length < shown) arr.push(Math.random());   // new plants start at different stages
  arr.length = shown;
  const cyclesPerSec = tossMult() / s.interval;
  for (let k = 0; k < shown; k++) {
    arr[k] += dt * cyclesPerSec;
    if (arr[k] >= 1) { arr[k] -= 1; tossItem(s, typeIndex, count / shown, k); }
  }
}
function growStage(s, k) {
  const n = GROW_SHEETS[s.grow].frames.length;
  const p = (growth[s.id] && growth[s.id][k]) || 0;
  return Math.min(n - 1, Math.floor(p * n));
}
// Draws one growth stage with its bottom (the dirt mound) at feetY.
function drawGrowSprite(g, stage, x, feetY) {
  if (!g.img.complete || !g.img.naturalWidth) return;
  const f = g.frames[stage];
  const w = f.w * g.scale, h = f.h * g.scale;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(g.img, f.x, f.y, f.w, f.h, Math.round(x - w / 2), Math.round(feetY - h), w, h);
  ctx.imageSmoothingEnabled = true;
}

const unitFacingRight = (s, k) => !!(movers[s.id] && movers[s.id][k] && movers[s.id][k].facingRight);
// path walkers only animate their walk while actually moving; everything else always animates
const unitMoving = (s, k) => s.zone !== 'path' || !!(movers[s.id] && movers[s.id][k] && movers[s.id][k].moving);

const TUFTS = Array.from({ length: 80 }, (_, i) => ({ u: hash(i + 300), v: hash(i + 400) }));

// How many of a source are drawn around the edge: one per owned unit, up to its
// own sprite list (or SPRITES_PER_TYPE copies of its icon).
const spritesShown = (s) => Math.min(state.owned[s.id],
  s.sheet ? SOURCE_SHEETS[s.sheet].rows : s.sprites ? s.sprites.length : SPRITES_PER_TYPE);

// Draws unit `k` of a sheet-based source: row k of the sheet, playing its idle loop.
// Each unit starts at a different frame so they don't all breathe in sync.
// The art faces left; `flip` mirrors it to face right.
function drawSheetSprite(sh, k, x, y, now, flip = false, moving = true) {
  if (!sh.img.complete || !sh.img.naturalWidth) return;
  const f = moving ? (Math.floor(now / sh.ms) + k * 3) % sh.frames : (sh.standFrame || 0);
  const w = sh.frameWidth * sh.scale, h = sh.frameHeight * sh.scale;
  ctx.imageSmoothingEnabled = sh.scale < 1;
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(sh.img, f * sh.frameWidth, k * sh.frameHeight, sh.frameWidth, sh.frameHeight,
    Math.round(-w / 2), Math.round(-h / 2), Math.round(w), Math.round(h));
  ctx.restore();
  ctx.imageSmoothingEnabled = true;
}

function tossItem(s, typeIndex, bundle, k = Math.floor(Math.random() * spritesShown(s))) {
  const src = unitPos(s, k);
  lastToss[s.id + k] = performance.now();
  const golden = Math.random() < goldenChance();
  const value = s.value * valueMult() * sourceValMult(s) * bundle * (golden ? goldenMult() : 1);
  const size = Math.round(26 + Math.min(12, Math.log2(bundle) * 2));
  const clovers = cloversPerSnack(s.id) * bundle;

  spawnItem(src, { kind: 'main', icon: s.item, value, clovers, golden, size });
  if (Math.random() < dupeChance()) spawnItem(src, { kind: 'main', icon: s.item, value, clovers, golden: false, size });
}

function spawnItem(src, props) {
  // Field is full: fold this toss's value and clovers into a random snack already out
  // there, so nothing is lost but the item count (and the lag) stays capped.
  // Event drops (`force`) always get their own item.
  if (items.length >= MAX_ITEMS && !props.force) {
    const host = items[Math.floor(Math.random() * items.length)];
    if (!host.dead) {
      host.value += props.value;
      host.clovers += props.clovers;
      host.golden = host.golden || props.golden;
      host.size = Math.min(44, host.size + 1);
      return;
    }
  }
  // props may override the landing spot (tx/ty), flight time and arc height.
  const it = {
    tx: randGrassX(), ty: randGrassY(),
    flight: rand(0.7, 1.2), arc: rand(60, 140),
    ...props,
    sx: src.x, sy: src.y,
    x: src.x, y: src.y,
    t: 0,
    rot: 0, vr: rand(-8, 8),
    landed: false, age: 0, dead: false, claimed: null,
  };
  if (CALM) {
    // No flying or spinning: the snack starts at its landing spot and fades in there.
    it.sx = it.x = it.tx;
    it.sy = it.y = it.ty;
    it.arc = 0; it.vr = 0; it.flight = 0.35;
  }
  items.push(it);
  if (items.length > MAX_ITEMS + 20) items.shift().dead = true; // hard ceiling, just in case
}

function collect(it, by) {
  if (it.dead) return;
  it.dead = true;
  const v = it.value * (by === 'helper' ? helperValMult() : 1);
  state.main += v;
  state.totalEarned += v;
  state.collected++;
  earnLog.push([performance.now(), v]);
  const important = it.golden || by !== 'helper';
  addFloat('+' + fmt(v), it.x, it.y, it.golden ? '#ffd166' : '#ffffff', important);

  // Once unlocked, every snack also gives clovers (like gum in Garbage Growth).
  if (state.cloversUnlocked) {
    let c = it.clovers;
    if (by === 'helper') c *= 1 + 0.5 * lvl('sniffers');
    if (it.golden) c += 25 * lvl('cloverRain');
    const lucky = Math.random() < rabbitsFootChance();   // Rabbit's Foot jackpot
    if (lucky) c *= 10;
    c = Math.max(1, Math.round(c));
    state.rare += c;
    state.totalRare += c;
    addFloat(`+${fmt(c)} ${THEME.rare.icon}${lucky ? ' 🐾x10' : ''}`, it.x, it.y + 18, '#8fe36a', important || lucky);
  }
}

// Floating numbers are capped so a busy field stays readable and cheap to draw: minor ones (babies'
// munches) stop at 30 on screen; important ones always show, dropping the oldest past 60.
const MAX_MINOR_FLOATS = 30, MAX_FLOATS = 60;
function addFloat(text, x, y, color, important) {
  if (!important && floats.length >= MAX_MINOR_FLOATS) return;
  floats.push({ text, x, y, color, life: 1, img: undefined, imgGen: -1 });
  if (floats.length > MAX_FLOATS) floats.shift();
}

// Keep the robot well inside the grass (GRASS is set by layoutField).
const GRASS_PAD = 40;
const ROBOT_TRIP = 250;            // max distance per stroll (~5s of walking)
const ROBOT_IDLE = [3, 10];        // seconds he stands around between strolls

// Next spot: a short trip from where he is, kept on the grass.
function pickRobotSpot() {
  const ang = rand(0, Math.PI * 2), dist = rand(60, ROBOT_TRIP);
  robot.tx = Math.min(GRASS.x1 - GRASS_PAD, Math.max(GRASS.x0 + GRASS_PAD, robot.x + Math.cos(ang) * dist));
  robot.ty = Math.min(GRASS.y1 - GRASS_PAD, Math.max(GRASS.y0 + GRASS_PAD + 30, robot.y + Math.sin(ang) * dist));
}

function updateRobot(dt) {
  if (!W || !H) return;
  if (!robot.placed) {
    robot.x = W / 2; robot.y = H / 2;
    robot.wait = rand(...ROBOT_IDLE);  // starts out just standing there
    pickRobotSpot();
    robot.placed = true;
  }
  if (robot.wait > 0) { robot.wait -= dt; robot.moving = false; return; }
  const dx = robot.tx - robot.x, dy = robot.ty - robot.y, d = Math.hypot(dx, dy);
  if (d < 2) {
    robot.wait = rand(...ROBOT_IDLE);  // idle for a while, then wander somewhere nearby
    pickRobotSpot();
    robot.moving = false;
    return;
  }
  const step = Math.min(d, 45 * dt);  // a slow, aimless stroll
  robot.x += (dx / d) * step;
  robot.y += (dy / d) * step;
  if (Math.abs(dx) > 0.5) robot.facingRight = dx > 0;
  robot.moving = true;
}

function syncHelpers() {
  if (!W || !H) return; // field not laid out yet; spawning now would pile them in the corner
  const count = state.levels.helper + 2 * lvl('fluffle');   // bought + free ones from Fluffle
  while (helpers.length < count) {
    helpers.push({ x: W / 2 + rand(-60, 60), y: H / 2 + rand(-60, 60), target: null, cd: 0,
                   facingRight: Math.random() < 0.5, moving: false, anim: newAnim('idle', true), wander: null });
  }
  helpers.length = count;
}

// =====================================================================
// Update
// =====================================================================

// =====================================================================
// Events & the family business: Godbunny visits, heists, carrot rain,
// binkies and the protection racket.
// =====================================================================

// Steady estimate of carrots/second from sources (perSecond() measures what was actually
// eaten, which drops to zero when you stop moving). Event rewards scale off this.
function incomeRate() {
  let r = 0;
  for (const s of SOURCES) r += state.owned[s.id] * s.value * sourceValMult(s) / s.interval;
  return r * valueMult() * tossMult();
}

function earn(v) {
  state.main += v;
  state.totalEarned += v;
}
function earnRare(c) {
  if (!state.cloversUnlocked || c <= 0) return 0;
  c = Math.max(1, Math.round(c));
  state.rare += c;
  state.totalRare += c;
  return c;
}

const ev = {
  godbunny: null, godbunnyIn: 0,   // { x, y, life } while visiting
  car: null, heistIn: 0,           // { x, nextDrop, gap } while racing by
  rain: null, rainIn: 0,           // { left, next } while raining
  binkyIn: 0, binkyFx: 0,          // seconds to next binky; ring animation timer
  racketIn: 10,
};
// Open the game as index.html#fast-events to make every event happen every few seconds (for testing).
if (location.hash === '#fast-events') {
  for (const e of Object.values(THEME.events)) e.every = [4, 8];
}

function resetEvents() {
  const E = THEME.events;
  ev.godbunny = ev.car = ev.rain = null;
  ev.godbunnyIn = rand(...E.godbunny.every) * 0.5;   // the first visit comes a bit sooner
  ev.heistIn = rand(...E.heist.every);
  ev.rainIn = rand(...E.carrotRain.every);
  ev.binkyIn = binkyEvery();
  ev.racketIn = 10;
}

function updateEvents(dt) {
  if (!W || !H) return;
  const E = THEME.events;

  // The Godbunny: appears on the grass for a few seconds. Munch him for a big gift.
  if (ev.godbunny) {
    const g = ev.godbunny;
    g.life -= dt;
    if (g.life <= 0) ev.godbunny = null;
    else if (mouse.inside && Math.hypot(mouse.x - g.x, mouse.y - g.y) < munchRadius() + 16) {
      const gift = Math.max(100, incomeRate() * 30) * (1 + 0.5 * lvl('godfather'));
      earn(gift);
      const c = earnRare(cloversPerSnack('sprout') * 25);
      addFloat('+' + fmt(gift), g.x, g.y - 24, '#ffd166', true);
      toast(`${E.godbunny.hat} ${E.godbunny.thanks}: ${cur(gift)}${c ? ` and ${THEME.rare.icon}${fmt(c)}` : ''}`, 3500);
      ev.godbunny = null;
    }
  } else if ((ev.godbunnyIn -= dt * (1 + 0.2 * lvl('madeBunny'))) <= 0) {
    ev.godbunny = { x: randGrassX(70), y: randGrassY(70), life: E.godbunny.stay };
    ev.godbunnyIn = rand(...E.godbunny.every);
  }

  // Heist: a getaway car races along the path dropping money bags onto the grass.
  if (ev.car) {
    const car = ev.car;
    car.x += (CALM ? 160 : 420) * dt;
    if (car.x >= car.nextDrop && car.nextDrop < W) {
      car.nextDrop += car.gap;
      spawnItem({ x: car.x, y: LAYOUT.path / 2 }, {
        kind: 'main', icon: E.heist.bag, value: Math.max(50, incomeRate() * 1.5),
        clovers: cloversPerSnack('sprout') * 3, golden: false, size: 32, force: true,
      });
    }
    if (car.x > W + 60) ev.car = null;
  } else if ((ev.heistIn -= dt) <= 0) {
    const bags = E.heist.bags + 3 * lvl('insideJob');
    ev.car = { x: -60, gap: W / (bags + 1), nextDrop: W / (bags + 1) };
    ev.heistIn = rand(...E.heist.every);
    toast(`${E.heist.car} ${E.heist.shout}`, 2500);
  }

  // Carrot Rain (skill): carrots fall straight down onto the grass for a few seconds.
  if (ev.rain) {
    const rain = ev.rain;
    rain.next -= dt;
    while (rain.next <= 0 && rain.left > 0) {
      rain.next += 0.15;
      rain.left--;
      const x = randGrassX(30);
      spawnItem({ x, y: GRASS.y0 - 10 }, {
        kind: 'main', icon: E.carrotRain.item, value: Math.max(20, incomeRate() * 0.6),
        clovers: cloversPerSnack('sprout'), golden: false, size: 28, force: true,
        tx: x, ty: randGrassY(30), arc: 8, flight: rand(0.5, 0.9),
      });
    }
    if (rain.left <= 0) ev.rain = null;
  } else if (lvl('carrotRain') > 0 && (ev.rainIn -= dt * lvl('carrotRain')) <= 0) {
    ev.rain = { left: E.carrotRain.drops, next: 0 };
    ev.rainIn = rand(...E.carrotRain.every);
    toast(`🌧️ ${E.carrotRain.shout}`, 2000);
  }

  // Binky (skill): every so often Gubby leaps for joy and munches everything in 2x radius.
  ev.binkyFx = Math.max(0, ev.binkyFx - dt);
  if (binkyEvery() > 0 && (ev.binkyIn -= dt) <= 0) {
    ev.binkyIn = binkyEvery();
    if (mouse.inside) {
      const reach = munchRadius() * 2;
      for (const it of items) {
        if (!it.dead && Math.hypot(it.x - mouse.x, it.y - mouse.y) < reach) collect(it, 'player');
      }
      ev.binkyFx = 0.5;
      addFloat('Binky!', mouse.x, mouse.y - 50, '#ffb3d9', true);
    }
  }

  // Protection Racket (skill): every 10s the family hands over a cut of recent earnings.
  if (lvl('racket') > 0 && (ev.racketIn -= dt) <= 0) {
    ev.racketIn = 10;
    const cut = perSecond() * 10 * 0.03 * lvl('racket');
    if (cut > 0) {
      earn(cut);
      addFloat(`💵 +${fmt(cut)}`, (GRASS.x0 + GRASS.x1) / 2, GRASS.y0 + 24, '#9be7a1', true);
    }
  }
}

// Draws an emoji mirrored left-to-right (cached image, so it's cheap).
function emojiFlipped(ch, x, y, size) {
  const img = emojiImage(ch, size);
  const s = size * 1.3;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(-1, 1);
  ctx.drawImage(img, -s / 2, -s / 2, s, s);
  ctx.restore();
}

function drawEvents(now) {
  const E = THEME.events;
  if (ev.godbunny) {
    const g = ev.godbunny;
    if (CALM || g.life > 2 || Math.floor(now / 150) % 2) {   // blinks when about to leave (not in calm mode)
      ctx.fillStyle = cbColor('rgba(255, 209, 102, 0.35)');
      ctx.beginPath(); ctx.arc(g.x, g.y, 34 + (CALM ? 0 : Math.sin(now / 180) * 4), 0, Math.PI * 2); ctx.fill();
      emoji(E.godbunny.icon, g.x, g.y, 40);
      emoji(E.godbunny.hat, g.x, g.y - 28, 26);
    }
  }
  if (ev.car) emojiFlipped(E.heist.car, ev.car.x, LAYOUT.path / 2 + 4, 40);   // the emoji faces left; it drives right
  if (ev.binkyFx > 0 && mouse.inside && !CALM) {
    const t = 1 - ev.binkyFx / 0.5;
    ctx.strokeStyle = cbColor('#ffb3d9');
    ctx.globalAlpha = 1 - t;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(mouse.x, mouse.y, munchRadius() * (1 + t), 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

// Dev Mode: keeps both currencies topped up to an effectively endless amount.
// (Doesn't count toward total earned, so it won't change your Family Rank.)
const DEV_AMOUNT = 1e18;
function toggleDevMode() {
  if (!state.devMode) {
    state.devSaved = { main: state.main, rare: state.rare };
    state.devMode = true;
    state.cloversUnlocked = true;   // so the clover counter and skill tree are usable
    toast('Dev Mode ON: infinite carrots and clovers', 2500);
  } else {
    state.devMode = false;
    if (state.devSaved) { state.main = state.devSaved.main; state.rare = state.devSaved.rare; }
    state.devSaved = null;
    toast('Dev Mode OFF: your real balances are back', 2500);
  }
  renderUI();
  save();
}

// Reused every step: where the fairies are this step (avoids making new objects 60 times a second).
const orbiters = [];
// Remove dead entries in place (no new array each step).
function compact(arr, keep) {
  let n = 0;
  for (let i = 0; i < arr.length; i++) if (keep(arr[i])) arr[n++] = arr[i];
  arr.length = n;
}
const isAlive = (it) => !it.dead;
const floatAlive = (f) => f.life > 0;

function update(dt) {
  if (state.devMode) { state.main = DEV_AMOUNT; state.rare = DEV_AMOUNT; }
  // Sources toss items
  SOURCES.forEach((s, i) => {
    const count = state.owned[s.id];
    if (!count) return;
    if (s.grow) return growPlants(s, i, dt, count);
    const rate = (count / s.interval) * tossMult();
    const bundle = Math.max(1, rate / MAX_TOSSES_PER_SEC);
    tossAcc[s.id] = (tossAcc[s.id] || 0) + dt * rate / bundle;
    let guard = 0;
    while (tossAcc[s.id] >= 1 && guard++ < 10) {
      tossAcc[s.id] -= 1;
      tossItem(s, i, bundle);
    }
  });

  // Player animation: hop while the cursor is moving, face the way it moves
  const pdx = mouse.x - player.lastX, pdy = mouse.y - player.lastY;
  if (Math.hypot(pdx, pdy) > 0.5) {
    player.moveTimer = 0.1;
    if (Math.abs(pdx) > 0.5) player.facingRight = pdx > 0;
  }
  player.lastX = mouse.x; player.lastY = mouse.y;
  player.moveTimer = Math.max(0, player.moveTimer - dt);
  player.moving = player.moveTimer > 0;
  const playerBase = player.moving ? 'hop' : 'idle';
  setLoop(player.anim, playerBase);
  player.anim.facingRight = player.facingRight;
  stepAnim(player.anim, dt);

  const r = munchRadius();
  const magnet = magnetRange();
  const lifetime = itemLifetime();
  const omerta = lvl('omerta') > 0;
  const reach = fairyReach();
  const braveBabies = lvl('braveBabies') > 0;

  // Orbiters circle the player
  if (!CALM) orbitAngle += dt * fairySpeed();   // calm: fairies hold still around Gubby
  const nOrb = mouse.inside ? orbiterCount() : 0;
  orbiters.length = nOrb;
  for (let a = 0; a < nOrb; a++) {
    const ang = orbitAngle + (a * Math.PI * 2) / nOrb;
    const o = orbiters[a] || (orbiters[a] = { x: 0, y: 0 });
    o.x = mouse.x + Math.cos(ang) * (r + 45); o.y = mouse.y + Math.sin(ang) * (r + 45);
  }

  // Items: fly, land, age, get munched
  for (const it of items) {
    if (it.dead) continue;
    it.t += dt;
    if (!it.landed) {
      const p = Math.min(1, it.t / it.flight);
      it.x = lerp(it.sx, it.tx, p);
      it.y = lerp(it.sy, it.ty, p) - it.arc * 4 * p * (1 - p);
      it.rot += it.vr * dt;
      if (p >= 1) { it.landed = true; it.rot = 0; }
    } else {
      it.age += dt;
      if (it.age > lifetime && !(it.golden && omerta)) { it.dead = true; continue; }   // Omertà: golden snacks stay
      if (magnet && mouse.inside) {
        const dx = mouse.x - it.x, dy = mouse.y - it.y, d = Math.hypot(dx, dy);
        if (d < r + magnet && d > 1) { it.x += (dx / d) * 110 * dt; it.y += (dy / d) * 110 * dt; }
      }
    }
    if (mouse.inside && Math.hypot(it.x - mouse.x, it.y - mouse.y) < r) { collect(it, 'player'); continue; }
    for (const o of orbiters) {
      if (Math.hypot(it.x - o.x, it.y - o.y) < reach) { collect(it, 'orbiter'); break; }
    }
  }
  compact(items, isAlive);

  // Helpers hop to the nearest landed, non-golden item
  syncHelpers();
  const speed = helperSpeed();
  for (const h of helpers) {
    h.anim.facingRight = h.facingRight;
    stepAnim(h.anim, h.anim.name === 'collect' ? dt / helperEatTime() : dt); // Quick Nibbles speeds up the eating animation too
    if (h.cd > 0) { h.cd -= dt; h.moving = false; continue; }
    if (!h.target || h.target.dead) {
      h.target = null;
      let best = null, bestD = Infinity;
      for (const it of items) {
        if (!it.landed || it.claimed || (it.golden && !braveBabies)) continue;
        const d = Math.hypot(it.x - h.x, it.y - h.y);
        if (d < bestD) { bestD = d; best = it; }
      }
      if (best) { best.claimed = h; h.target = best; }
    }
    let tx, ty;
    if (h.target) { tx = h.target.x; ty = h.target.y; }
    else {
      if (!h.wander || Math.hypot(h.wander.x - h.x, h.wander.y - h.y) < 10) {
        h.wander = { x: randGrassX(30), y: randGrassY(30) };
      }
      tx = h.wander.x; ty = h.wander.y;
    }
    const dx = tx - h.x, dy = ty - h.y, d = Math.hypot(dx, dy);
    const step = speed * dt * (h.target ? 1 : 0.3);
    h.moving = d > 0.5;
    if (h.moving) {
      h.x += (dx / d) * Math.min(step, d);
      h.y += (dy / d) * Math.min(step, d);
      if (Math.abs(dx) > 1) h.facingRight = dx > 0;
    }
    setLoop(h.anim, h.moving ? 'hop' : 'idle');
    if (h.target && d < 12) {
      collect(h.target, 'helper');
      h.target = null;
      playOnce(h.anim, 'collect');
      h.cd = animLength('collect') / 1000 * helperEatTime(); // stand still while eating
    }
  }

  if (state.robot) updateRobot(dt);
  updateEvents(dt);
  updateMovers(dt);

  for (const f of floats) { f.life -= dt; if (!CALM) f.y -= 40 * dt; }   // calm: numbers fade in place
  compact(floats, floatAlive);
}

// =====================================================================
// Draw
// =====================================================================

// Snacks and floating numbers keep the image they were last drawn with (`_img`), tagged with the cache
// generation; clearing the caches (icon sheet loaded, screen density changed) bumps it so they refresh.
let imageGen = 0;
function clearImageCaches() { emojiCache.clear(); textCache.clear(); imageGen++; }

// Emoji are rendered once per (emoji, size) into a small offscreen canvas and then
// blitted with drawImage, which is far cheaper than drawing text every frame.
const emojiCache = new Map();
function emojiImage(ch, size) {
  const key = ch + '|' + size;
  let img = emojiCache.get(key);
  if (!img) {
    const px = Math.ceil(size * 1.3 * DPR);
    img = document.createElement('canvas');
    img.width = img.height = px;
    const c = img.getContext('2d');
    // snacks and money with a pixel-art icon draw that instead (see ITEM_SHEET)
    const icon = EMOJI_ICON[ch];
    if (icon && itemIconReady()) {
      drawItemIcon(c, icon, px / 2, px / 2, size * 1.05 * DPR);
      emojiCache.set(key, img);
      return img;
    }
    c.scale(DPR, DPR);
    c.font = `${size}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillStyle = '#000'; // colour emoji inherit the fill's alpha, so it must be opaque
    const mid = px / DPR / 2;
    if (ch.startsWith('bundle:')) {
      // Three of the emoji fanned out from the bottom, tied together with a band
      const e = ch.slice(7);
      c.font = `${Math.round(size * 0.8)}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
      for (const a of [-0.45, 0.45, 0]) {
        c.save();
        c.translate(mid, mid + size * 0.25);
        c.rotate(a);
        c.fillText(e, 0, -size * 0.25);
        c.restore();
      }
      c.fillStyle = cbColor('#c0392b');
      c.fillRect(mid - size * 0.18, mid + size * 0.12, size * 0.36, size * 0.1);
    } else {
      c.fillText(ch, mid, mid);
    }
    if (!icon) emojiCache.set(key, img);   // an iconed emoji drawn before the sheet loaded is redrawn later
  }
  return img;
}

function emoji(ch, x, y, size, rot = 0, alpha = 1, c = ctx) {
  blitEmoji(emojiImage(ch, Math.round(size)), x, y, size, rot, alpha, c);
}
// Draws a cached emoji/icon image (from emojiImage) centred at (x, y).
// Whole-pixel positions and sizes keep pixel art crisp, and whole numbers are also cheaper to pass to
// the canvas (fractional ones make a tiny temporary object per argument).
function blitEmoji(img, x, y, size, rot = 0, alpha = 1, c = ctx) {
  const s = Math.round(Math.round(size) * 1.3), h = s >> 1;
  if (alpha !== 1) c.globalAlpha = alpha;
  if (rot) {
    c.save();
    c.translate(Math.round(x), Math.round(y));
    c.rotate(rot);
    c.drawImage(img, -h, -h, s, s);
    c.restore();
  } else {
    c.drawImage(img, Math.round(x) - h, Math.round(y) - h, s, s);
  }
  if (alpha !== 1) c.globalAlpha = 1;
}

// A source sprite is either an emoji or an image path / data URL (drawn 40px tall, crisp pixels).
const spriteImgs = new Map();
const isImageSprite = (spec) => /^data:image\/|\.(png|gif|webp|jpe?g)$/i.test(spec);
function drawSourceSprite(spec, x, y, size = 34) {
  if (!isImageSprite(spec)) return emoji(spec, x, y, size);
  let img = spriteImgs.get(spec);
  if (!img) { const im = img = new Image(); im.src = spec; spriteImgs.set(spec, im); cbTrack(spec, (url) => { im.src = url; }); }
  if (!img.complete || !img.naturalWidth) return;
  const h = Math.round(size * 1.2), w = img.naturalWidth * h / img.naturalHeight;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, x - w / 2, y - h / 2, w, h);
  ctx.imageSmoothingEnabled = true;
}

// Floating "+5" numbers are pre-rendered (text + shadow) once per string/colour and
// reused, instead of laying out text twice per number every frame.
const textCache = new Map();
const FLOAT_FONT = 'bold 20px "Segoe UI", sans-serif';
function textImage(text, color) {
  const key = text + '|' + color;
  let img = textCache.get(key);
  if (!img) {
    if (textCache.size > 400) textCache.clear();
    img = document.createElement('canvas');
    const c = img.getContext('2d');
    c.font = FLOAT_FONT;
    // text with snack/money emoji in it ("+5 🍀") puts the pixel-art icons inline
    if (hasIcon(text) && itemIconReady()) return textWithIcons(img, c, text, color, key);
    const w = Math.ceil(c.measureText(text).width) + 4, h = 26;
    img.width = Math.ceil(w * DPR); img.height = Math.ceil(h * DPR);
    img.w = w; img.h = h;
    c.scale(DPR, DPR);
    c.font = FLOAT_FONT;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillStyle = 'rgba(0,0,0,0.5)';
    c.fillText(text, w / 2 + 1, h / 2 + 1);
    c.fillStyle = cbColor(color);
    c.fillText(text, w / 2, h / 2);
    textCache.set(key, img);
  }
  return img;
}

// A floating number with inline icons: text runs get the usual shadow; icons sit 20px tall in line with them.
function textWithIcons(img, c, text, color, key) {
  const ICON = 20, runs = iconRuns(text);
  for (const r of runs) r.w = r.icon ? ICON + 2 : c.measureText(r.text).width;
  const w = Math.ceil(runs.reduce((a, r) => a + r.w, 0)) + 4, h = 26;
  img.width = Math.ceil(w * DPR); img.height = Math.ceil(h * DPR);
  img.w = w; img.h = h;
  c.scale(DPR, DPR);
  c.font = FLOAT_FONT;
  c.textBaseline = 'middle';
  let x = 2;
  for (const r of runs) {
    if (r.icon) drawItemIcon(c, r.icon, x + r.w / 2, h / 2, ICON);
    else {
      c.fillStyle = 'rgba(0,0,0,0.5)'; c.fillText(r.text, x + 1, h / 2 + 1);
      c.fillStyle = cbColor(color); c.fillText(r.text, x, h / 2);
    }
    x += r.w;
  }
  textCache.set(key, img);
  return img;
}

// The grass, path, beds and pad only change when the window resizes, so they're
// drawn once into their own canvas and copied each frame.
const bgCanvas = document.createElement('canvas');
const bgCtx = bgCanvas.getContext('2d');
let bgKey = '';
function drawBackground() {
  const key = `${W}x${H}@${DPR}`;
  if (key !== bgKey) {
    bgKey = key;
    bgCanvas.width = canvas.width;
    bgCanvas.height = canvas.height;
    const b = bgCtx;
    b.setTransform(DPR, 0, 0, DPR, 0, 0);
    const gw = GRASS.x1 - GRASS.x0, gh = GRASS.y1 - GRASS.y0;

    // Grass
    b.fillStyle = cbColor(THEME.grass);
    b.fillRect(GRASS.x0, GRASS.y0, gw, gh);
    b.fillStyle = 'rgba(0,0,0,0.08)';
    for (const t of TUFTS) b.fillRect(GRASS.x0 + t.u * gw, GRASS.y0 + t.v * gh, 4, 3);

    // Dirt path across the top, with a few pebbles
    b.fillStyle = cbColor(THEME.path);
    b.fillRect(0, 0, W, LAYOUT.path);
    b.fillStyle = 'rgba(0,0,0,0.12)';
    for (let i = 0; i < 60; i++) b.fillRect(hash(i + 500) * W, hash(i + 600) * (LAYOUT.path - 4), 3, 2);
    b.fillStyle = 'rgba(0,0,0,0.15)';
    b.fillRect(0, LAYOUT.path - 3, W, 3);

    // Garden beds down both sides: soil with furrows inside a wooden border
    for (const x of [0, W - LAYOUT.bed]) {
      b.fillStyle = cbColor(THEME.bedEdge);
      b.fillRect(x, GRASS.y0, LAYOUT.bed, gh);
      b.fillStyle = cbColor(THEME.bed);
      b.fillRect(x + 6, GRASS.y0 + 6, LAYOUT.bed - 12, gh - 12);
      b.fillStyle = 'rgba(0,0,0,0.18)';
      for (let y = GRASS.y0 + 16; y < GRASS.y1 - 10; y += 14) b.fillRect(x + 10, y, LAYOUT.bed - 20, 2);
    }

    // Concrete pad across the bottom, with a curb and expansion seams
    b.fillStyle = cbColor(THEME.pad);
    b.fillRect(0, GRASS.y1, W, LAYOUT.pad);
    b.fillStyle = 'rgba(255,255,255,0.35)';
    b.fillRect(0, GRASS.y1, W, 4);
    b.fillStyle = 'rgba(0,0,0,0.12)';
    for (let x = 90; x < W; x += 90) b.fillRect(x, GRASS.y1 + 4, 2, LAYOUT.pad);
    b.fillRect(0, GRASS.y1 + 4 + (LAYOUT.pad - 4) / 2, W, 2);
  }
  ctx.drawImage(bgCanvas, 0, 0, W, H);
}

// Draws the current frame of a Gubby animation centred on (x, y).
function drawGubby(x, y, scale, anim) {
  if (!sheet.complete) return;
  const def = animDef(anim);
  const f = def.frames[anim.idx % def.frames.length];
  const fw = SPRITE.frameWidth, fh = SPRITE.frameHeight;
  const w = fw * scale, h = fh * scale;
  const feetY = y + (SPRITE.footY - fh / 2) * scale;
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(x, feetY, w * 0.3, 5 * scale, 0, 0, Math.PI * 2); ctx.fill();
  ctx.imageSmoothingEnabled = scale < 1; // smooth when shrinking, crisp pixels when enlarging
  ctx.drawImage(sheet, f * fw, def.row * fh, fw, fh,
    Math.round(x - w / 2), Math.round(y - h / 2), Math.round(w), Math.round(h));
  ctx.imageSmoothingEnabled = true;
}

function draw() {
  drawBackground();
  const lifetime = itemLifetime();
  const omerta = lvl('omerta') > 0;
  const r = munchRadius();

  // Sources: walkers on the path, plants in the beds, buildings on the pad
  const now = performance.now();
  for (const s of SOURCES) {
    const shown = spritesShown(s);
    for (let k = 0; k < shown; k++) {
      const pos = unitPos(s, k);
      const since = now - (lastToss[s.id + k] || 0);
      const bob = since < 200 && !CALM ? -6 * Math.sin((since / 200) * Math.PI) : 0;
      if (s.grow) drawGrowSprite(GROW_SHEETS[s.grow], growStage(s, k), pos.x, pos.y + 22);
      else if (s.sheet) drawSheetSprite(SOURCE_SHEETS[s.sheet], k, pos.x, pos.y + bob, now, unitFacingRight(s, k), unitMoving(s, k));
      else drawSourceSprite(s.sprites ? s.sprites[k] : s.icon, pos.x, pos.y + bob, s.zone === 'pad' ? 46 : 34);
    }
  }

  // Items
  const glow = CALM ? 0 : Math.sin(now / 150) * 3;   // golden snacks pulse together (not in calm mode)
  for (const it of items) {
    let fade = it.landed && !(it.golden && omerta) ? Math.min(1, (lifetime - it.age) / 2) : 1;
    if (CALM && !it.landed) fade = Math.min(1, it.t / it.flight);   // calm: fade in where it lands
    if (!it.landed && !CALM) {
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.beginPath();
      ctx.ellipse(it.x, lerp(it.sy, it.ty, Math.min(1, it.t / it.flight)) + 10, 10, 4, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    if (it.golden) {
      ctx.globalAlpha = 0.35 * fade;
      ctx.fillStyle = cbColor('#ffd166');
      ctx.beginPath(); ctx.arc(it.x, it.y, it.size * 0.8 + glow, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // the snack keeps its image until its size changes (merged tosses grow it) or the caches are cleared
    if (it._img === undefined || it._imgSize !== it.size || it._imgGen !== imageGen) {
      it._img = emojiImage(it.icon, Math.round(it.size)); it._imgSize = it.size; it._imgGen = imageGen;
    }
    blitEmoji(it._img, it.x, it.y, it.size, it.rot, fade);
  }

  // Bonder: one flat image, mirrored to face the way he's going. While walking he
  // bobs and waddles side to side. (robot.x, robot.y + 30) is where his feet are.
  if (state.robot && robot.placed) {
    const feetY = robot.y + 30;
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(robot.x, feetY, 18, 5, 0, 0, Math.PI * 2); ctx.fill();
    const a = ROBOT_ART.bonder;
    if (a.img.complete && a.img.naturalWidth) {
      const step = now / 140;
      const bob = robot.moving && !CALM ? -Math.abs(Math.sin(step)) * 4 : 0;
      const tilt = robot.moving && !CALM ? Math.sin(step) * 0.08 : 0;
      ctx.save();
      ctx.translate(Math.round(robot.x), Math.round(feetY + bob));
      ctx.rotate(tilt);
      if (robot.facingRight) ctx.scale(-1, 1);   // the art faces left
      ctx.drawImage(a.img, -a.w / 2, -a.h, a.w, a.h);
      ctx.restore();
    }
  }

  drawEvents(now);

  // Helpers (baby gubbies), sorted in place so lower ones draw on top
  helpers.sort((a, b) => a.y - b.y);
  for (const h of helpers) drawGubby(h.x, h.y, HELPER_SCALE, h.anim);

  // Orbiters
  if (mouse.inside) {
    const n = orbiterCount();
    for (let a = 0; a < n; a++) {
      const ang = orbitAngle + (a * Math.PI * 2) / n;
      emoji(THEME.orbiterIcon, mouse.x + Math.cos(ang) * (r + 45), mouse.y + Math.sin(ang) * (r + 45), 26);
    }
  }

  // Floating numbers (pre-rendered images, see textImage)
  for (const f of floats) {
    if (f.img === undefined || f.imgGen !== imageGen) { f.img = textImage(f.text, f.color); f.imgGen = imageGen; }
    const img = f.img;
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.drawImage(img, Math.round(f.x - img.w / 2), Math.round(f.y - img.h / 2 - 6), img.w, img.h);
  }
  ctx.globalAlpha = 1;

  // Player
  if (mouse.inside) {
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.setLineDash([6, 6]);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(mouse.x, mouse.y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    drawGubby(mouse.x, mouse.y, PLAYER_SCALE, player.anim);
    if (lvl('fedora')) emoji('🎩', mouse.x + (player.facingRight ? 3 : -3), mouse.y - 36, 28);   // Fedora skill: very respected
  }
}

// =====================================================================
// Shop UI
// =====================================================================

const sourceEls = {};
const upgradeEls = {};
const skillEls = {};

function rowButton(icon, name, desc) {
  const btn = document.createElement('button');
  btn.className = 'row-btn';
  btn.innerHTML = `
    <span class="icon">${iconizeHTML(icon)}</span>
    <span class="info"><span><span class="name">${iconizeHTML(name)}</span><span class="owned"></span></span><span class="desc">${iconizeHTML(desc)}</span></span>
    <span class="cost"></span>`;
  return { btn, owned: btn.querySelector('.owned'), cost: btn.querySelector('.cost'), desc: btn.querySelector('.desc'), baseDesc: desc };
}

// A small element showing the first frame of one row of a sprite sheet (for shop icons).
function sheetIcon(sh, row, size) {
  const k = size / sh.frameWidth;
  const el = document.createElement('span');
  el.className = 'sheet-icon';
  el.style.width = el.style.height = size + 'px';
  el.style.backgroundImage = `url(${sh.url})`;
  sh.els.push((url) => { el.style.backgroundImage = `url(${url})`; });
  el.style.backgroundSize = `${sh.frames * sh.frameWidth * k}px ${sh.rows * sh.frameHeight * k}px`;
  el.style.backgroundPosition = `${-(sh.standFrame || 0) * sh.frameWidth * k}px ${-row * sh.frameHeight * k}px`;
  return el;
}

function buildShop() {
  SOURCES.forEach((s) => {
    const el = rowButton(s.sheet ? '' : s.icon, s.name, `${s.desc} ${itemLabel(s)} worth ${fmt(s.value)}`);
    if (s.sheet) el.btn.querySelector('.icon').appendChild(sheetIcon(SOURCE_SHEETS[s.sheet], 0, 44));
    el.btn.addEventListener('click', (e) => buySource(s, e.ctrlKey || e.metaKey));
    $('sources').appendChild(el.btn);
    sourceEls[s.id] = el;
  });
  const ru = THEME.rareUnlock;
  const rareEl = rowButton(ru.icon, ru.name, ru.desc);
  rareEl.btn.id = 'rare-unlock';
  rareEl.cost.innerHTML = iconizeText(cur(ru.cost));
  rareEl.btn.addEventListener('click', buyRareUnlock);
  $('upgrades').appendChild(rareEl.btn);

  UPGRADES.forEach((u) => {
    const el = rowButton(u.icon, u.name, u.desc);
    el.btn.addEventListener('click', (e) => buyUpgrade(u, e.ctrlKey || e.metaKey));
    $('upgrades').appendChild(el.btn);
    upgradeEls[u.id] = el;
  });

  const rb = THEME.robot;
  const robotEl = rowButton('', rb.name, rb.desc);
  const robotIcon = document.createElement('img');
  robotIcon.src = ROBOT_ART.bonder.url;
  ROBOT_ART.bonder.els.push((url) => { robotIcon.src = url; });
  robotIcon.style.height = '44px';
  robotEl.btn.querySelector('.icon').appendChild(robotIcon);
  robotEl.btn.id = 'robot-btn';
  robotEl.btn.addEventListener('click', buyRobot);
  $('upgrades').appendChild(robotEl.btn);
  upgradeEls.robot = robotEl;
  $('goal-icon').textContent = THEME.goal.icon;
  $('goal-name').textContent = THEME.goal.name;
  $('goal-desc').textContent = THEME.goal.desc;
  $('goal-btn').addEventListener('click', buyGoal);
}

function buySource(s, max) {
  if (!sourceUnlocked(s)) return;
  const room = sourceMax(s) - state.owned[s.id];
  const n = Math.min(room, max ? Math.max(1, sourceMaxAffordable(s)) : 1);
  if (n <= 0) return;
  const cost = sourceCost(s, n);
  if (state.main < cost) return;
  state.main -= cost;
  state.owned[s.id] += n;
  renderUI();
}

function buyRobot() {
  if (state.robot || state.main < THEME.robot.cost) return;
  state.main -= THEME.robot.cost;
  state.robot = true;
  toast(`You bought ${THEME.robot.name}. He will not help.`, 3000);
  renderUI();
}

function buyRareUnlock() {
  if (state.cloversUnlocked || state.main < THEME.rareUnlock.cost) return;
  state.main -= THEME.rareUnlock.cost;
  state.cloversUnlocked = true;
  toast(`${THEME.rareUnlock.name} unlocked! Every snack now gives ${THEME.rare.name}. Press T for the skill tree.`, 3500);
  renderUI();
}

function buyUpgrade(u, max) {
  let bought = 0;
  do {
    const level = state.levels[u.id];
    if (level >= u.maxLv()) break;
    const cost = u.cost(level);
    if (state.main < cost) break;
    state.main -= cost;
    state.levels[u.id]++;
    bought++;
  } while (max && bought < 1000);
  renderUI();
}

function buyGoal() {
  if (state.main < THEME.goal.cost || state.won) return;
  state.main -= THEME.goal.cost;
  state.won = true;
  state.wonAt = Date.now();
  save();
  showWin();
}

function showWin() {
  $('win-title').textContent = THEME.win.title;
  $('win-text').textContent = THEME.win.text;
  $('win-stats').innerHTML = iconizeHTML(
    `Time: <b>${fmtTime((state.wonAt - state.startedAt) / 1000)}</b> · ` +
    `${THEME.main.name} eaten: <b>${fmt(state.collected)}</b> · ${THEME.rare.name} found: <b>${fmt(state.totalRare)}</b>`);
  $('win-overlay').classList.remove('hidden');
}

// The UI refreshes 10x a second, but writing to the page (even the same value)
// makes the browser redo style/layout work. These only touch the DOM on a change.
// Text with snack/money emoji in it shows the pixel-art icons inline (see iconizeText).
function setText(el, v) {
  if (el._text === v) return;
  el._text = v;
  if (typeof v === 'string' && hasIcon(v)) el.innerHTML = iconizeText(v); else el.textContent = v;
}
function setShown(el, show) { if (el._shown !== show) { el._shown = show; el.style.display = show ? '' : 'none'; } }
function setDisabled(el, d) { if (el.disabled !== d) el.disabled = d; }

// Family rank in the header, with a toast when you're promoted.
let shownRank = -1;
function renderRank() {
  const r = rankIndex();
  if (r === shownRank) return;
  const rank = THEME.ranks[r];
  if (shownRank >= 0 && r > shownRank) {
    toast(`${rank.icon} You've been made ${rank.name}! (+${Math.round(THEME.rankBonus * 100 * r)}% carrots)`, 3500);
  }
  shownRank = r;
  setText($('rank-icon'), rank.icon);
  setText($('rank'), rank.name);
}

// "The Daily Carrot": rotates through the headlines in a shuffled order.
let newsOrder = [], newsPos = 0;
function nextHeadline() {
  if (newsPos >= newsOrder.length) {
    newsOrder = THEME.headlines.map((_, i) => i).sort(() => Math.random() - 0.5);
    newsPos = 0;
  }
  const text = THEME.headlines[newsOrder[newsPos++]]
    .replace('{eaten}', fmt(state.collected))
    .replace('{rank}', THEME.ranks[rankIndex()].name);
  const el = $('news-text');
  el.style.opacity = 0;                       // quick fade between headlines
  setTimeout(() => { el.innerHTML = iconizeText(text); el.style.opacity = 1; }, 400);
}

function renderUI() {
  renderRank();
  setText($('main'), fmt(state.main));
  setText($('rare'), fmt(state.rare));
  setText($('mps'), cur(perSecond()));

  // Show every unlocked source, plus the next locked one as a teaser.
  let teaserShown = false;
  SOURCES.forEach((s) => {
    const el = sourceEls[s.id];
    const owned = state.owned[s.id];
    const unlocked = sourceUnlocked(s);
    const cap = sourceMax(s);
    const maxed = owned >= cap;
    const cost = sourceCost(s);
    setShown(el.btn, unlocked || !teaserShown);
    if (!unlocked) teaserShown = true;
    el.btn.classList.toggle('locked', !unlocked);
    setText(el.owned, unlocked ? ` ${owned}/${cap}` : '');
    setText(el.desc, unlocked ? el.baseDesc : `🔒 Unlock in the skill tree (${THEME.rare.icon} ${s.unlockCost})`);
    setText(el.cost, !unlocked ? '' : maxed ? 'MAX' : cur(cost));
    setDisabled(el.btn, !unlocked || maxed || state.main < cost);
  });

  UPGRADES.forEach((u) => {
    const el = upgradeEls[u.id];
    const level = state.levels[u.id];
    const maxed = level >= u.maxLv();
    const cost = u.cost(level);
    setText(el.owned, ` ${level}/${u.maxLv()}`);
    setText(el.cost, maxed ? 'MAX' : cur(cost));
    setDisabled(el.btn, maxed || state.main < cost);
  });

  setDisabled($('goal-btn'), state.won || state.main < THEME.goal.cost);
  setText($('goal-cost'), state.won ? 'OWNED' : cur(THEME.goal.cost));

  const robotEl = upgradeEls.robot;
  setShown(robotEl.btn, state.robot || lvl('robotIsland') > 0); // secret: unlocked by the skill-tree island
  setText(robotEl.cost, state.robot ? 'OWNED' : cur(THEME.robot.cost));
  setDisabled(robotEl.btn, state.robot || state.main < THEME.robot.cost);

  // Rare currency is hidden (and the skill tree locked) until its one-time unlock is bought.
  const rareOn = state.cloversUnlocked;
  setShown($('rare-unlock'), !rareOn);
  setDisabled($('rare-unlock'), state.main < THEME.rareUnlock.cost);
  setShown($('rare').parentElement, rareOn);
  setDisabled($('skills-btn'), !rareOn);
  setText($('dev-btn'), state.devMode ? 'Dev Mode: ON' : 'Dev Mode: OFF');
  $('dev-btn').classList.toggle('on', !!state.devMode);
  $('skills-btn').title = rareOn ? '' : `Buy ${THEME.rareUnlock.name} in the shop first`;

  if (!$('skill-overlay').classList.contains('hidden')) renderSkills();
}

// =====================================================================
// Skill tree UI — a pannable, zoomable board of icon nodes.
// A node is "open" once its parent has at least one level, shown with a
// padlock when only its grandparent is owned, and hidden beyond that.
// =====================================================================

const CELL = 96;                        // px between grid cells
const MIN_TREE_ZOOM = 0.25;             // how far the board can zoom out
const ISLAND_ZOOM = 0.5;                // "island" skills are invisible until zoomed out this far
const SVG_NS = 'http://www.w3.org/2000/svg';
const treeView = { x: 0, y: 0, z: 1 };  // pan offset and zoom
const treeDrag = { active: false, moved: false, sx: 0, sy: 0, vx: 0, vy: 0 };
let tipSkill = null;

function skillState(s) {
  if (!s.parent || lvl(s.id) > 0 || lvl(s.parent) > 0) return 'open';
  const grand = SKILL_BY_ID[s.parent].parent;
  return !grand || lvl(grand) > 0 ? 'locked' : 'hidden';
}

function buildSkills() {
  const world = $('tree-world');
  const svg = $('tree-lines');
  const bg = document.createElementNS(SVG_NS, 'g');
  const fg = document.createElementNS(SVG_NS, 'g');
  svg.append(bg, fg);
  const line = (group, cls, a, b) => {
    const l = document.createElementNS(SVG_NS, 'line');
    l.setAttribute('x1', a.x * CELL); l.setAttribute('y1', a.y * CELL);
    l.setAttribute('x2', b.x * CELL); l.setAttribute('y2', b.y * CELL);
    l.setAttribute('class', cls);
    group.appendChild(l);
    return l;
  };

  for (const s of SKILLS) {
    if (s.parent) {
      const p = SKILL_BY_ID[s.parent];
      s.edgeBg = line(bg, 'edge-bg', p, s);
      s.edge = line(fg, 'edge', p, s);
    }
    const btn = document.createElement('button');
    btn.className = 'node' + (s.unlock ? ' unlock' : '') + (s.island ? ' island' : '');
    btn.style.left = s.x * CELL + 'px';
    btn.style.top = s.y * CELL + 'px';
    btn.innerHTML = '<span class="n-icon"></span><span class="lvl"></span><span class="plus">+</span>';
    btn.addEventListener('click', () => { if (!treeDrag.moved) buySkill(s); });
    btn.addEventListener('pointerenter', () => showTip(s));
    btn.addEventListener('pointerleave', hideTip);
    world.appendChild(btn);
    skillEls[s.id] = { btn, icon: btn.querySelector('.n-icon'), lvl: btn.querySelector('.lvl') };
  }

  // Drag to pan, wheel to zoom
  const view = $('tree-view');
  view.addEventListener('pointerdown', (e) => {
    Object.assign(treeDrag, { active: true, moved: false, sx: e.clientX, sy: e.clientY, vx: treeView.x, vy: treeView.y });
  });
  window.addEventListener('pointermove', (e) => {
    if (!treeDrag.active) return;
    const dx = e.clientX - treeDrag.sx, dy = e.clientY - treeDrag.sy;
    if (!treeDrag.moved && Math.hypot(dx, dy) > 5) { treeDrag.moved = true; view.classList.add('dragging'); hideTip(); }
    if (treeDrag.moved) { treeView.x = treeDrag.vx + dx; treeView.y = treeDrag.vy + dy; applyTreeView(); }
  });
  window.addEventListener('pointerup', () => {
    treeDrag.active = false;
    view.classList.remove('dragging');
    setTimeout(() => { treeDrag.moved = false; }, 0); // after the click event has seen it
  });
  view.addEventListener('wheel', (e) => {
    e.preventDefault();
    const z = Math.min(1.6, Math.max(MIN_TREE_ZOOM, treeView.z * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
    const wx = (e.clientX - treeView.x) / treeView.z, wy = (e.clientY - treeView.y) / treeView.z;
    treeView.x = e.clientX - wx * z;
    treeView.y = e.clientY - wy * z;
    treeView.z = z;
    applyTreeView();
    hideTip();
  }, { passive: false });
  centerTree();
}

function applyTreeView() {
  const world = $('tree-world');
  world.style.transform = `translate(${treeView.x}px, ${treeView.y}px) scale(${treeView.z})`;
  world.classList.toggle('far', treeView.z <= ISLAND_ZOOM); // islands only show when zoomed way out
}

function centerTree() {
  treeView.z = 1;
  treeView.x = window.innerWidth / 2;
  treeView.y = window.innerHeight * 0.55;
  applyTreeView();
}

function buySkill(s) {
  if (skillState(s) !== 'open') return;
  const l = lvl(s.id);
  if (l >= s.max) return;
  const cost = skillCost(s, l);
  if (state.rare < cost) return;
  state.rare -= cost;
  state.skills[s.id] = l + 1;
  toast(s.max > 1 ? `${s.name} → level ${l + 1}` : `Learned ${s.name}!`);
  renderUI();
  renderSkills();
}

function renderSkills() {
  setText($('skill-rare'), `${THEME.rare.icon} ${fmt(state.rare)}`);
  for (const s of SKILLS) {
    const el = skillEls[s.id];
    const st = skillState(s);
    const l = lvl(s.id);
    const maxed = l >= s.max;
    const canBuy = st === 'open' && !maxed && state.rare >= skillCost(s, l);
    setShown(el.btn, st !== 'hidden');
    el.btn.classList.toggle('locked', st === 'locked');
    el.btn.classList.toggle('owned', l > 0);
    el.btn.classList.toggle('maxed', maxed);
    el.btn.classList.toggle('can-buy', canBuy);
    el.btn.classList.toggle('cant-buy', st === 'open' && !maxed && !canBuy);
    setText(el.icon, st === 'locked' ? '🔒' : s.icon);
    const lvText = l > 0 && s.max > 1 ? `${l}/${s.max}` : '';
    setText(el.lvl, lvText);
    setShown(el.lvl, !!lvText);
    if (s.edge) {
      setShown(s.edge, st !== 'hidden');
      setShown(s.edgeBg, st !== 'hidden');
      s.edge.classList.toggle('lit', l > 0);
    }
  }
  if (tipSkill) showTip(tipSkill);
}

function showTip(s) {
  tipSkill = s;
  const tip = $('tree-tip');
  const st = skillState(s);
  const l = lvl(s.id);
  let html;
  if (st === 'locked') {
    html = `<div class="t-head"><span class="t-name">Locked</span></div>
      <div class="t-desc">Learn ${SKILL_BY_ID[s.parent].name} first.</div>`;
  } else {
    const maxed = l >= s.max;
    const cost = skillCost(s, l);
    const costLine = maxed
      ? '<div class="t-cost">MAXED</div>'
      : `<div class="t-cost ${state.rare < cost ? 'cant' : ''}">${THEME.rare.icon} ${fmt(cost)}</div>`;
    html = `<div class="t-head"><span class="t-name">${s.name}</span><span class="t-lvl">${l}/${s.max}</span></div>
      <div class="t-desc">${s.desc}${s.max > 1 ? ' per level' : ''}.</div>${costLine}`;
  }
  // Called 10x a second while open; skip the rebuild and re-measure if nothing changed.
  if (html === tip._html && tip._for === s && !tip.classList.contains('hidden')) return;
  tip._html = html;
  tip._for = s;
  tip.innerHTML = iconizeHTML(html);
  const r = skillEls[s.id].btn.getBoundingClientRect();
  tip.classList.remove('hidden');
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = r.right + 14;
  if (x + tw > window.innerWidth - 8) x = r.left - tw - 14;
  const y = Math.min(window.innerHeight - th - 8, Math.max(8, r.top + r.height / 2 - th / 2));
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
}

function hideTip() {
  tipSkill = null;
  $('tree-tip').classList.add('hidden');
  $('tree-tip')._for = null;
}

function toggleSkills(show) {
  const ov = $('skill-overlay');
  const open = show ?? ov.classList.contains('hidden');
  ov.classList.toggle('hidden', !open);
  if (open) renderSkills(); else hideTip();
}


// =====================================================================
// Save / load
// =====================================================================

function save(showToast = false) {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    if (showToast) toast('Game saved.');
  } catch (e) {
    console.warn('Save failed', e);
  }
}

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      const base = freshState();
      state = {
        ...base, ...saved,
        owned: { ...base.owned, ...saved.owned },
        levels: { ...base.levels, ...saved.levels },
      };
    }
  } catch (e) {
    console.warn('Load failed, starting fresh', e);
    state = freshState();
  }
  // Older saves stored skills as a flat list. Keep the ones that still exist
  // and refund the clovers spent on the ones that were replaced.
  if (Array.isArray(state.skills)) {
    const OLD_COSTS = { radius1: 1, value1: 2, value2: 6, golden1: 10, golden2: 20, dupe: 12, rare1: 3, rare2: 8,
      orbiter1: 15, orbiter2: 30, magnet: 45, helperSpd: 2, helperVal: 6, helperCost: 10, rate1: 5, rate2: 25 };
    const map = {};
    let refund = 0;
    for (const id of state.skills) {
      if (id.startsWith('unlock_') && SKILL_BY_ID[id]) map[id] = 1;
      else refund += OLD_COSTS[id] || 0;
    }
    state.skills = map;
    state.rare += refund;
    if (refund) setTimeout(() => toast(`The skill tree changed! Refunded ${refund} ${THEME.rare.icon}`, 4000), 500);
  }
  // Bigger Appetite / Tastier Snacks used to be carrot upgrades in the shop; carry the levels over as skills.
  const moved = { radius: 'appetite', value: 'tasty' };
  for (const [oldId, newId] of Object.entries(moved)) {
    if (state.levels[oldId]) {
      state.skills[newId] = Math.min(SKILL_BY_ID[newId].max, Math.max(lvl(newId), state.levels[oldId]));
    }
    delete state.levels[oldId];
  }
  // Saves from before the clover unlock existed: if they ever had clovers or skills, it's unlocked.
  if (!state.cloversUnlocked && (state.totalRare > 0 || state.rare > 0 || Object.keys(state.skills).length)) {
    state.cloversUnlocked = true;
  }
  // Sources already owned count as unlocked, and everything respects the caps. If a cap
  // went down (e.g. farmers 25 -> 5), refund what the extras and any cap skills cost.
  let refundMain = 0, refundRare = 0;
  for (const s of SOURCES) {
    if (s.unlockCost && state.owned[s.id] > 0) state.skills[unlockId(s)] = 1;
    if (s.fixedMax && state.skills[s.id + '_cap']) {
      for (let l = 0; l < state.skills[s.id + '_cap']; l++) refundRare += Math.ceil(capSkillBase(s) * Math.pow(1.7, l));
      delete state.skills[s.id + '_cap'];
    }
    const cap = sourceMax(s);
    for (let k = cap; k < state.owned[s.id]; k++) refundMain += s.baseCost * Math.pow(SOURCE_GROWTH, k);
    state.owned[s.id] = Math.min(state.owned[s.id], cap);
  }
  if (refundMain || refundRare) {
    state.main += refundMain;
    state.rare += refundRare;
    const parts = [refundMain && `${THEME.main.icon}${fmt(refundMain)}`, refundRare && `${THEME.rare.icon}${fmt(refundRare)}`].filter(Boolean);
    setTimeout(() => toast(`Some caps changed! Refunded ${parts.join(' and ')}`, 4000), 600);
  }
  for (const u of UPGRADES) state.levels[u.id] = Math.min(state.levels[u.id], u.maxLv());
}

// First click arms the button, a second click within 3s wipes everything.
// (No confirm() popup: some browsers and embedded views block it.)
let resetArmedUntil = 0;
function hardReset() {
  const btn = $('reset-btn');
  if (performance.now() > resetArmedUntil) {
    resetArmedUntil = performance.now() + 3000;
    btn.textContent = 'Sure? Click again';
    setTimeout(() => { if (performance.now() > resetArmedUntil) btn.textContent = 'Reset'; }, 3050);
    return;
  }
  resetArmedUntil = 0;
  btn.textContent = 'Reset';
  state = freshState();
  items = []; helpers = []; floats = [];
  earnLog.length = 0;
  save();
  $('win-overlay').classList.add('hidden');
  renderUI();
  renderSkills();
  resetEvents();
  shownRank = -1;
  toast('All progress wiped.');
}

let toastTimer;
function toast(msg, ms = 2000) {
  const el = $('toast');
  el.innerHTML = iconizeText(msg);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

// =====================================================================
// Input + main loop
// =====================================================================

function setMouse(e) {
  const r = canvas.getBoundingClientRect();
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
  if (!mouse.inside) { player.lastX = mouse.x; player.lastY = mouse.y; }
  mouse.inside = true;
  $('hint').style.opacity = 0;
}

function init() {
  load();
  resize();
  buildShop();
  buildSkills();

  $('main-icon').innerHTML = iconizeText(THEME.main.icon);
  $('rare-icon').innerHTML = iconizeText(THEME.rare.icon);
  $('sources-title').textContent = THEME.sourcesTitle;
  $('skill-hint').textContent = THEME.skillHint;
  $('hint').textContent = THEME.hint;
  $('news-title').textContent = THEME.newsTitle;
  resetEvents();
  nextHeadline();
  setInterval(nextHeadline, 9000);

  window.addEventListener('resize', resize);
  // Also catch size changes that aren't window resizes (first layout, header wrapping, etc.)
  if (window.ResizeObserver) new ResizeObserver(resize).observe($('field-wrap'));
  canvas.addEventListener('pointermove', setMouse);
  canvas.addEventListener('pointerdown', setMouse);
  canvas.addEventListener('pointerleave', () => { mouse.inside = false; });

  const colorSel = $('color-mode');
  for (const [id, m] of Object.entries(CB_MODES)) colorSel.add(new Option(m.label, id));
  colorSel.value = cbMode;
  colorSel.addEventListener('change', () => { setColorMode(colorSel.value); colorSel.blur(); });
  $('skills-btn').addEventListener('click', () => toggleSkills());
  $('skills-close').addEventListener('click', () => toggleSkills(false));
  $('skills-center').addEventListener('click', centerTree);
  $('win-close').addEventListener('click', () => $('win-overlay').classList.add('hidden'));
  $('save-btn').addEventListener('click', () => save(true));
  $('reset-btn').addEventListener('click', hardReset);
  $('dev-btn').addEventListener('click', toggleDevMode);
  document.addEventListener('keydown', (e) => {
    if ((e.key === 't' || e.key === 'T') && state.cloversUnlocked) toggleSkills();
    if (e.key === 'Escape') toggleSkills(false);
  });

  // Simulation runs on its own timer in small fixed steps (so it keeps going
  // even when the browser throttles animation frames); drawing uses rAF.
  const STEP = 1 / 60;
  let last = performance.now();
  let acc = 0;
  setInterval(() => {
    const now = performance.now();
    acc = Math.min(acc + (now - last) / 1000, 2); // catch up at most 2s after a stall
    last = now;
    // Normal frames run 1/60s steps; after a stall, catch up in a few bigger steps so a
    // slow machine doesn't freeze running hundreds of tiny ones.
    while (acc >= STEP) { const d = Math.min(acc, 0.05); update(d); acc -= d; }
  }, 16);
  const skillOverlay = $('skill-overlay');
  function frame() {
    // Schedule the next frame first, so one bad frame can never stop drawing for good.
    requestAnimationFrame(frame);
    // The skill tree covers the whole screen, so don't paint the field underneath it.
    // Also skip while the field has no size yet (e.g. the page loaded in a hidden window).
    if (W > 0 && H > 0 && skillOverlay.classList.contains('hidden')) draw();
  }
  requestAnimationFrame(frame);

  renderUI();
  setInterval(renderUI, 100);
  setInterval(() => save(), 10000);
  window.addEventListener('beforeunload', () => save());
}

init();
</script>
