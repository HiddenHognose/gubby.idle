<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gubby Icon Maker</title>
<style>
  body { margin: 0; padding: 20px; background: #1d1a2b; color: #f1edff; font-family: "Segoe UI", system-ui, sans-serif; }
  h1 { margin: 0 0 4px; color: #7ee0a1; font-size: 1.4rem; }
  p { color: #a59fc4; margin: 0 0 16px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 20px; }
  .card { background: #2a2640; border-radius: 10px; padding: 12px; }
  .card h2 { margin: 0 0 8px; font-size: .9rem; color: #a59fc4; font-weight: 600; }
  canvas { image-rendering: pixelated; display: block; }
  .checker { background: repeating-conic-gradient(#3a3556 0 25%, #332f4c 0 50%) 0 0 / 16px 16px; }
  .field { background: #6fbf5a; }
  .path { background: #b8946a; }
  .flex { display: flex; gap: 12px; align-items: flex-end; }
  button { background: #353052; color: #f1edff; border: 1px solid #4a4470; border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
</style>
</head>
<body>
<h1>Gubby Icon Maker</h1>
<p>Pixel-art replacements (64×64 unless noted) for the game's emoji. Each icon is built from shapes, then outlined and shaded.</p>
<div id="icons"></div>

<script>
// S = pixel size of the icon being drawn. Shapes are authored in layout units: an icon can say how many
// units span its frame (`layout`, default 64) and shift its drawing (`offset`), so K = S / layout.
let S = 64, K = 1, OX = 0, OY = 0;   // OX/OY shift the layout (in layout units) inside the frame

// Shared palette (16-bit style ramps: base / shade / light)
const PAL = {
  outline: '#0b0a10', inner: '#07060b',
  fur: '#23222c', furS: '#17161e', furL: '#3e3d4b',         // black bunny fur
  furD: '#121117', furDS: '#0a090d', furDL: '#211f28',      // legs behind the body, a clear step darker
  earIn: '#4b4957', earInS: '#3a3845', earInL: '#5c5a69',
  hat: '#1f1e27', hatS: '#15141b', hatL: '#3d3c4a', stripe: '#5f5e6e',
  coat: '#363a50', coatS: '#272a3b', coatL: '#5a5f7b',     // slate suit, cooler and lighter than the fur
  sleeve: '#3d4158', sleeveS: '#2c2f42', sleeveL: '#646a88',
  white: '#f4f2ee', whiteS: '#cbc6d1', whiteL: '#ffffff',
  skin: '#f6c21c', skinS: '#d49412', skinL: '#ffe066', skinD: '#9c650c',
  gold: '#f0c040', goldS: '#b8862a', goldL: '#fff0a0',
  tie: '#24232d', tieS: '#191820', tieL: '#24232d',
  ink: '#1a1208',
  // the rest of the gang
  shirt: '#cfd2bd', shirtS: '#a2a993', shirtL: '#e8eadb',   // sage short-sleeved shirt
  shirtD: '#7b8371',                                       // sleeve seams
  wfur: '#e8e7ee', wfurS: '#c1bece', wfurL: '#ffffff',      // white bunny fur
  wfurD: '#bbb8c8', wfurDS: '#a09cb0', wfurDL: '#d5d3df',   // ...legs behind the body
  wear: '#f2b8bd', wearS: '#dc9aa2', wearL: '#f8d0d3',       // pink inner ears
  yfur: '#eeae1e', yfurS: '#c88612', yfurL: '#ffd65a',      // yellow bunny fur
  yfurD: '#c48812', yfurDS: '#9f6b0c', yfurDL: '#daa22e',
  year: '#d88e2a', yearS: '#b7731c', yearL: '#e9a84a',
  vest: '#2e3252', vestS: '#20233b', vestL: '#4c5277',      // navy vest, bluer and lighter than the fur
  navy: '#2a2c4a', navyS: '#1b1c33', navyL: '#444870',      // caps, ribbon, earmuff
  tband: '#474b74', tbandS: '#383b5e', tbandL: '#5a5f8c',   // top hat band and crown top
  grey: '#cbcec2', greyS: '#9fa496', greyL: '#e6e8de',      // light grey hat
  hair: '#1d1b2c', hairS: '#13121e', hairL: '#33304a',      // dark fringe
  scarf: '#2b2938', scarfS: '#1e1c28', scarfL: '#46435a',
  blush: '#f07a5c', glint: '#5c6080',
  // items (snacks and money)
  carrot: '#f0862a', carrotS: '#c4601a', carrotL: '#ffb454',
  leaf: '#5cc24a', leafS: '#3a8f33', leafL: '#8fe070',
  ribbon: '#d9343c', ribbonS: '#a02030', ribbonL: '#ff6a6a',
  clover: '#4fb848', cloverS: '#2f8a35', cloverL: '#8ee070',
  berry: '#e8384a', berryS: '#b0203a', berryL: '#ff7a84', seed: '#ffe066',
  lettuce: '#8ed05a', lettuceS: '#5ea43a', lettuceL: '#c4ee8c', lettuceLS: '#a6dc6e', lettuceLL: '#e2f8c0',
  cheese: '#ffd255', cheeseS: '#e8a830', cheeseL: '#fff2a8',
  crust: '#d8913c', crustS: '#b06e25', crustL: '#f0b866',
  pep: '#c8303a', pepS: '#962030', pepL: '#e85a5a',
  tin: '#b8bcc8', tinS: '#868b9a', tinL: '#e2e5ee',
  label: '#d9443a', labelS: '#a8302a', labelL: '#f06a5a',
  leather: '#8a5a33', leatherS: '#6b4426', leatherL: '#a8744a',
  straw: '#f2a2b8',
  juice: '#f39a3a', juiceS: '#c8702a', juiceL: '#ffc070',
  sack: '#d9b77a', sackS: '#b08e52', sackL: '#f0d49a',
  cash: '#7cc47a', cashS: '#4f9a55', cashL: '#a8e2a0', cashD: '#3e7a46',
};

// ---------- shape primitives (inside tests in pixel space) ----------
const ell = (cx, cy, rx, ry, rot = 0) => (x, y) => {
  const dx = x - cx, dy = y - cy, c = Math.cos(rot), s = Math.sin(rot);
  const lx = (c * dx + s * dy) / rx, ly = (-s * dx + c * dy) / ry;
  return lx * lx + ly * ly < 1;
};
// ellipse with a wavy edge (fur, hair, foliage)
const blob = (cx, cy, rx, ry, amp, k, phase = 0) => (x, y) => {
  const lx = (x - cx) / rx, ly = (y - cy) / ry, th = Math.atan2(ly, lx);
  return Math.hypot(lx, ly) < 1 + amp * Math.sin(th * k + phase) + amp * 0.5 * Math.sin(th * k * 2.3 + phase * 1.7);
};
const poly = (pts) => (x, y) => {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
};
const rrect = (x0, y0, x1, y1, r) => (x, y) => {
  if (x < x0 || x > x1 || y < y0 || y > y1) return false;
  const cx = Math.min(Math.max(x, x0 + r), x1 - r), cy = Math.min(Math.max(y, y0 + r), y1 - r);
  return Math.hypot(x - cx, y - cy) <= r;
};

// ---------- renderer ----------
// part: { id, group?, test, ramp: 'key' (uses key, keyS, keyL), noLine?: [groups], lineColor?, shade?: {hi, lo} }
function render(parts, extras) {
  const col = Array(S * S).fill(null), who = Array(S * S).fill(null);
  const at = (x, y) => (x < 0 || y < 0 || x >= S || y >= S) ? null : who[y * S + x];
  const grp = p => p.group || p.id;
  const byId = Object.fromEntries(parts.map(p => [p.id, p]));

  for (const p of parts) {
    const px = [];
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) if (p.test((x + 0.5) / K - OX, (y + 0.5) / K - OY)) px.push([x, y]);
    if (!px.length) continue;
    // light from the top-left, measured across the part's own bounding box
    const xs = px.map(q => q[0]), ys = px.map(q => q[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const hi = p.shade?.hi ?? -0.7, lo = p.shade?.lo ?? 0.45;
    for (const [x, y] of px) {
      const u = (x - (x0 + x1) / 2) / Math.max(1, (x1 - x0) / 2), v = (y - (y0 + y1) / 2) / Math.max(1, (y1 - y0) / 2);
      const t = 0.55 * u + 0.85 * v;
      col[y * S + x] = t > lo ? p.ramp + 'S' : t < hi ? p.ramp + 'L' : p.ramp;
      who[y * S + x] = p.id;
    }
  }

  const out = col.slice();
  const N4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const order = Object.fromEntries(parts.map((p, i) => [p.id, i]));

  // inner lines: a part gets a line where it borders a different group drawn behind it
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const id = who[y * S + x]; if (!id) continue;
    const p = byId[id];
    for (const [dx, dy] of N4) {
      const n = at(x + dx, y + dy);
      if (!n || grp(byId[n]) === grp(p) || order[n] > order[id]) continue;
      if (p.noLine?.includes(grp(byId[n]))) continue;
      out[y * S + x] = p.lineColor || 'inner'; break;
    }
  }

  // silhouette outline
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    if (who[y * S + x]) continue;
    if (N4.some(([dx, dy]) => at(x + dx, y + dy))) out[y * S + x] = 'outline';
  }

  extras?.({ out, who, at, put: (x, y, c) => { if (x >= 0 && y >= 0 && x < S && y < S) out[y * S + x] = c; } });
  return out;
}

const stamp = (put, ox, oy, rows, map) =>
  rows.forEach((r, j) => [...r].forEach((ch, i) => { if (ch !== '.') put(ox + i, oy + j, map[ch]); }));

function line(put, x0, y0, x1, y1, c) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
  for (let i = 0; i <= n; i++) put(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), c);
}

// =====================================================================
// ICONS
// =====================================================================
const ICONS = {};

// ---------------------------------------------------------------------
// Bunny-taur gang (80×80, 3/4 view). A gentleman's upper body on a black bunny body.
// Shared: tall black bunny ears (twitching around where they attach), a black curly mane around a
// yellow face, and the all-fur bunny half: a tall round body, front legs level with the right one in
// front (melded into the chest), back legs level and further away (smaller, higher), legs behind
// the body darker, and a puffy tail. Each character adds its own outfit, hat and face.
// Idle loop (8 frames): breathing (upper body sinks 1px), tail wag, right-ear flick.
// The layout is 72 units tall and shifted down 7 so the tall ears fit; pixel details go through PX/PY.
// ---------------------------------------------------------------------
const fluffy = (cx, cy, rx, ry, k = 12, amp = 0.22, p = 0) => blob(cx, cy, rx, ry, amp, k, p);
// distance from (x, y) to segment a-b
const segDist = (x, y, [ax, ay], [bx, by]) => {
  const vx = bx - ax, vy = by - ay, t = Math.max(0, Math.min(1, ((x - ax) * vx + (y - ay) * vy) / (vx * vx + vy * vy)));
  return Math.hypot(x - ax - t * vx, y - ay - t * vy);
};
// a ribbon/strap following a polyline, `r` units thick on each side
const strip = (pts, r) => (x, y) => pts.some((p, i) => i > 0 && segDist(x, y, pts[i - 1], p) < r);
// an ear defined by where it attaches: at rest its centre sits at `rest` (angle `restRot`); turning it to
// `rot` swings that centre around the base point, so a twitch pivots where the ear meets the head
const earAt = ([bx, by], [rx0, ry0], restRot, rot, rx, ry) => {
  const a = rot - restRot, vx = rx0 - bx, vy = ry0 - by, c = Math.cos(a), s = Math.sin(a);
  return ell(bx + c * vx - s * vy, by + s * vx + c * vy, rx, ry, rot);
};

function bunnyTaur(look) {
  return { size: 80, layout: 72, offset: [0, 7], frames: 8, ms: 110, draw: (f) => {
    const N = 8, ph = (f / N) * Math.PI * 2;
    const PX = v => Math.round((v + OX) * K), PY = v => Math.round((v + OY) * K);   // layout -> pixels
    // Walk cycle (in place; the game slides the sprite along). Legs step in a diagonal trot, the whole body
    // bobs down a pixel twice per cycle as the legs pass under it, and the arms swing opposite each other.
    const bob = [0, 1, 1, 0, 0, 1, 1, 0][f];                // body bob, in whole pixels
    const dy = bob / K;                                     // ...and in layout units
    const U = test => (x, y) => test(x, y - dy);            // parts that ride along with the bob
    const flick = f === 5 ? 0.3 : f === 6 ? 0.12 : 0;        // right ear flick
    const wag = Math.sin(ph * 2) * 0.9;                     // quick little tail wag
    // arm swing: rotate an arm part about its shoulder (near arm forward when the far one is back)
    const swingAbout = ([px, py], a) => test => U((x, y) => {
      const c = Math.cos(-a), s = Math.sin(-a), vx = x - px, vy = y - py;
      return test(px + c * vx - s * vy, py + s * vx + c * vy);
    });
    const swingNear = swingAbout([33.6, 30], -0.16 * Math.sin(ph)), swingFar = swingAbout([19.2, 30], 0.16 * Math.sin(ph));
    const ctx = { f, ph, dy, bob, U, PX, PY, swingNear, swingFar };
    // fur colours: black by default; a look can pick another ramp (its darker leg ramp is the same name + "D").
    // Light fur needs darker rim lines and tufts to show.
    const F = look.fur || 'fur', FD = F + 'D', EI = look.earIn || 'earIn';
    const RIM = look.furRim || 'furL', TUFT = look.furTuft || 'furL';

    // Depth: the bunny body recedes to the right, so things further back are drawn smaller.
    // d(x) is the scale at a given x (1 at the front legs, ~0.7 at the far hind leg).
    const d = x => 1 - Math.max(0, x - 22) * 0.011;
    // A furry leg hanging from `top` (at x = `cx`, riding the bob) down to a paw at ground level `foot`,
    // `w` wide at full scale (times `s`). Each leg steps with its own `phase`: the paw swings forward (to the
    // left) with a little lift, then plants and slides back under the body.
    const legs = [];
    // `meld` legs join the body group (no seam, no highlight cap) so they grow out of the fur above them
    const leg = (id, x0, w, top, ground, ramp, s = d(x0), meld = false, phase = 0) => {
      const hw = w * s / 2;
      const pw = hw + 1.3 * s;   // paws are rounded buns, wider than the leg
      const q = ph + phase, cx = x0 - 3 * s * Math.sin(q), foot = ground - 1.9 * s * Math.max(0, Math.cos(q));
      legs.push({ id, cx, hw, pw, s, foot });
      return [
        { id, group: meld ? 'body' : id, ramp, shade: meld ? { hi: -2, lo: 0.5 } : undefined,
          test: strip([[x0, top + dy + hw], [cx, foot - hw * 0.6]], hw + 0.3) },
        // paw: a rounded bun bulging forward, with four toe bumps along the bottom (the notches between them
        // become the toe gaps); a soft seam where it meets the leg
        { id: id + 'Paw', group: id + 'Paw', ramp, lineColor: RIM, shade: { hi: -0.45, lo: 0.7 },
          test: (x, y) => y < foot + 0.8 * s && (ell(cx - 0.6 * s, foot - 1 * s, pw, 2.4 * s)(x, y) ||
            [-0.6, -0.2, 0.2, 0.6].some(t => Math.hypot(x - (cx - 0.6 * s + t * pw), y - (foot - 0.1 * s)) < 0.3 * pw + 0.25)) },
      ];
    };

    // The head (and whatever sits on it) can be lowered onto the shoulders with `headDy`; hats can sink a
    // little further onto the head with `hatSink`. UH / UT apply those offsets on top of the breathing.
    const HD = look.headDy || 0, HS = HD + (look.hatSink || 0);
    const UH = t => U((x, y) => t(x, y - HD)), UT = t => U((x, y) => t(x, y - HS));
    const headCtx = { ...ctx, U: UH, PY: v => PY(v + HD) }, hatCtx = { ...ctx, U: UT, PY: v => PY(v + HS) };

    // Ears hang from fixed attachment points, so the flick pivots at the base instead of sliding.
    // Each ear: base point, resting centre (outer and inner), resting angle, and size. The default pair
    // pokes up through the top of a hat; `earSpec` can replace it (e.g. ears out of the sides of the head).
    const [sx, sy] = look.earShift || [0, 0];
    const at0 = (x, y) => [x + sx, y + sy];
    const spec = look.earSpec || [
      { side: 'L', base: at0(23.27, 8.62), rest: at0(21.8, 2.6), restIn: at0(21.8, 2.9), rot: -0.24, rx: 2.3, ry: 7.6, ryIn: 5.8 },
      { side: 'R', base: at0(29.81, 8.29), rest: at0(31.4, 2.3), restIn: at0(31.4, 2.6), rot: 0.26, rx: 2.3, ry: 7.8, ryIn: 6 },
    ];
    const UE = look.earsBehindHead ? UH : UT;   // ears in a hat follow the hat; ears on the head follow the head
    const ears = look.noEars ? [] : spec.flatMap(e => {
      const rot = e.rot + (e.side === 'R' ? flick * Math.sign(e.rot || 1) : 0);
      return [
        { id: 'ear' + e.side, ramp: F, test: UE(earAt(e.base, e.rest, e.rot, rot, e.rx, e.ry)) },
        { id: 'ear' + e.side + 'In', group: 'ear' + e.side, ramp: EI, test: UE(earAt(e.base, e.restIn, e.rot, rot, 1, e.ryIn)), shade: { hi: -2, lo: 0.6 } },
      ];
    });

    // sort the outfit into layers by part id (see ARM_LAYERS)
    const outfitParts = look.outfit(ctx), layer = p => ARM_LAYERS[p.id] || 'clothes';
    const outfit = { far: [], clothes: [], near: [], top: [] };
    for (const p of outfitParts) outfit[layer(p)].push(p);

    const parts = [
      // bunny half: all fur, receding back and up to the right, getting smaller with distance
      { id: 'tail', ramp: F, lineColor: RIM, test: U(fluffy(51.6 + wag * 0.7, 29.6, 3.1, 2.8, 8, 0.25, 0.4)) },
      // back legs: a pair standing level with each other, further away (higher up, smaller) than the front pair
      ...leg('legFarHind', 51.2, 7, 40, 58.4, F, 0.8, false, 0),
      // front legs: a pair standing level; the left one is tucked behind the body
      ...leg('legFrontBehind', 21.5, 7, 46.5, 61.6, FD, 1, false, Math.PI),
      { id: 'body', ramp: F, test: U((x, y) => fluffy(37.5, 39.6, 9.2, 8.8, 13, 0.07, 0.2)(x, y) || fluffy(30, 42.4, 8.6, 8.8, 11, 0.07, 1.4)(x, y)) },   // tall and round; belly line low
      { id: 'haunch', ramp: F, lineColor: RIM, test: U(fluffy(45.4, 37.8, 7.2, 9, 10, 0.08, 1)) },
      ...leg('legNearHind', 44.6, 7, 43.5, 58.4, FD, 0.8, true, Math.PI),
      { id: 'chest', group: 'body', ramp: F, test: U(fluffy(25, 46.5, 10, 5.5, 11, 0.12, 0.8)) },
      ...leg('legFrontFront', 30.2, 7, 44, 61.6, F, 1, true, 0),   // the right front leg is in front of the body, growing out of the chest

      // upper body, back to front: the farther arm (bottom layer), anything hanging behind the body (the
      // leader's long hair), the clothes, then the closer arm over all of them, then neckwear like the stole
      ...outfit.far,
      ...(look.behind?.(ctx) || []),
      ...outfit.clothes,
      ...outfit.near,
      ...outfit.top,

      // head: ears grow out from behind the head when there's no hat to hide their base
      ...(look.earsBehindHead ? ears : []),
      ...(look.underFace?.(headCtx) || []),
      // the face: a round yellow head by default; a look can supply its own (the leader's is framed by hair)
      ...(look.head?.(headCtx) || [{ id: 'face', ramp: 'skin', test: UH(ell(25.8, 20.6, 7.6, 6.8)), shade: { hi: -0.8, lo: 0.7 } }]),
      ...(look.overFace?.(headCtx) || []),
      ...(look.earsBehindHead ? [] : ears),
      ...(look.hat?.(hatCtx) || []),
    ];

    return render(parts, (r) => {
      const { out, who, at, put } = r;
      const is = (x, y, ...ids) => ids.includes(who[y * S + x]) && out[y * S + x] !== 'inner';
      Object.assign(ctx, r, { is });
      // the hat shades the top of the face; `eyeShadow` deepens it into a dark band that hides the eyes
      const shadeBy = look.shadeFaceBy || [];
      for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
        if (!shadeBy.length || !is(x, y, 'face')) continue;
        const k = [1, 2, 3, 4, 5].find(k => shadeBy.includes(at(x, y - k)));
        if (look.eyeShadow ? k <= 3 : k <= 2) out[y * S + x] = look.eyeShadow ? 'skinD' : 'skinS';
        else if (look.eyeShadow && k) out[y * S + x] = 'skinS';
      }
      look.decorate?.(ctx);   // pixel patterns (pinstripes, tie stripes, ...)
      look.face({ ...ctx, PY: headCtx.PY });   // face stamps (in head coordinates)
      // buttons, chains, straps ... sit on the clothes, so they never draw over the closer arm
      const onClothes = (x, y, c) => { if (ARM_LAYERS[who[y * S + x]] !== 'near') put(x, y, c); };
      look.details?.({ ...ctx, put: onClothes, putAny: put });
      // toe gaps: short lines rising from the bottom of each paw, in a contrasting shade so they show
      for (const l of legs) for (const t of [-0.4, 0, 0.4]) {
        const x = PX(l.cx - 0.6 * l.s + t * l.pw);
        let y = S - 1;
        while (y > 0 && who[y * S + x] !== l.id + 'Paw') y--;
        if (y > 0) { put(x, y, RIM); if (who[(y - 1) * S + x] === l.id + 'Paw') put(x, y - 1, RIM); }
      }
      // fur tufts on the bunny body
      for (const [tx, ty] of [[42, 34], [43, 35], [47, 37], [48, 38], [37, 37], [50.5, 40], [22, 48], [23, 49], [33, 43.5]]) {
        const x = PX(tx), y = PY(ty) + bob, w = who[y * S + x];
        if (w === 'body' || w === 'haunch' || w === 'chest') put(x, y, TUFT);
      }
    });
  } };
}

// ---------------------------------------------------------------------
// Shared upper body, after the user's torso guide: a slim, tapered torso (sloped shoulders, narrower waist)
// in 3/4 view, turned to the left. The torso and the clothes on it are mirrored across the torso's centre
// line by MX. Everything rides the walk bob.
// ---------------------------------------------------------------------
const MX = x => 51.4 - x;                                   // mirror across the torso centre (x = 25.7)
const mirror = pts => pts.map(([x, y]) => [MX(x), y]);
const mirrorBox = ([x0, y0, x1, y1]) => [MX(x1), y0, MX(x0), y1];
const TORSO = mirror([
  [17.8, 30.6], [19.6, 29.2], [22.2, 28.6], [29.4, 28.6], [32, 29.2], [33.6, 30.8],
  [33.4, 36.4], [32.4, 40.6], [33, 44.6], [18.6, 44.6], [19.4, 40.6], [18.4, 36.4],
]);
const torso = dy => poly(TORSO.map(([x, y]) => [x, y + dy]));
// He's turned to the left, so his own left arm is the CLOSER one: it hangs on the viewer's right and is drawn
// over all the clothing. His right arm is the FARTHER one: it hangs on the viewer's left, mostly hidden
// behind the body, and is the bottom layer of the upper body (see ARM_LAYERS).
const ARM_NEAR = {   // closer arm: fuller, hanging in front of the near (right) side of the body
  sleeveLong:  [[31.6, 29.6], [35.4, 29.8], [36, 37], [36.2, 41.4], [32.8, 41.4], [32.4, 37]],
  sleeveShort: [[31.6, 29.6], [35.4, 29.8], [35.8, 35], [32.2, 35]],
  forearm:     [[32.2, 34.8], [35.8, 34.8], [36, 43.2], [32.6, 43.2]],
  cuff: [34.3, 41.8], hand: [34.3, 44.8, 2.1, 2], fold: [32.2, 35.8, 34.4],
};
const ARM_FAR = {    // farther arm: thinner, tucked behind the far (left) edge so only a sliver and the hand peek out
  sleeveLong:  [[18.2, 30.2], [20.6, 30], [20.2, 37], [20, 41.2], [17.6, 41.2], [17.4, 37]],
  sleeveShort: [[18.2, 30.2], [20.6, 30], [20.4, 35], [17.6, 35]],
  forearm:     [[17.6, 34.8], [20.2, 34.8], [20, 43], [17.8, 43]],
  cuff: [18.8, 41.6], hand: [18.7, 44.4, 1.5, 1.5], fold: [17.6, 20.4, 34.4],
};
// which layer each arm part draws in: the farther arm (R) is the bottom layer; the closer arm (L) goes over
// all the clothing; the leader's stole sits on top of that, under the head
const ARM_LAYERS = {
  sleeveR: 'far', cuffR: 'far', handR: 'far', armR: 'far',
  sleeveL: 'near', cuffL: 'near', handL: 'near', armL: 'near',
  stole: 'top',
};
// a bare forearm and its hand as one continuous piece (no seam at the wrist)
const bareArm = a => (x, y) => poly(a.forearm)(x, y) || ell(...a.hand)(x, y);

// pixel helpers for faces (face centre is at layout (25.3, 21.4))
const blush = ({ put, PX, PY, bob }, sides = [-1, 1]) => {
  for (const s of sides) stamp(put, PX(25.3) + (s < 0 ? -6 : 4), PY(22.2) + bob, ['bbb'], { b: 'blush' });
};

// ---------------------------------------------------------------------
// 1. Mafioso (Carrot Farmer row 0): the leader. Pinstriped hat, long curly black hair, eyes lost in the brim.s shadow, white fur stole, slate double-breasted jacket with gold
//    buttons, striped tie and watch chain, white fluffy cuffs, and a plain smile.
// ---------------------------------------------------------------------
ICONS.mafioso = bunnyTaur({
  shadeFaceBy: ['brim'],
  eyeShadow: true,   // his eyes are lost in the shadow of the brim
  // long curly black hair falling behind his shoulders
  behind: ({ U }) => [
    { id: 'hair', ramp: 'fur', test: U(fluffy(26.4, 24, 11.6, 11.4, 11, 0.16, 0.2)) },
  ],
  // his face, framed by that hair (no beard)
  head: ({ U }) => [
    { id: 'face', ramp: 'skin', test: U(ell(25.3, 21.4, 6.1, 4.9)), shade: { hi: -0.8, lo: 0.8 } },
  ],
  outfit: ({ U, dy, swingNear, swingFar }) => [
    // far (right) arm hangs mostly behind the body, since he's turned three-quarters to the left
    { id: 'sleeveR', ramp: 'sleeve', lineColor: 'sleeveL', test: swingFar(poly(ARM_FAR.sleeveLong)) },
    { id: 'cuffR', ramp: 'white', test: swingFar(fluffy(ARM_FAR.cuff[0], ARM_FAR.cuff[1], 2.4, 1.8, 8, 0.25, 1.9)) },
    { id: 'handR', ramp: 'skin', test: swingFar(ell(...ARM_FAR.hand)) },
    { id: 'torso', ramp: 'coat', lineColor: 'coatL', test: torso(dy) },
    { id: 'shirt', ramp: 'white', test: U(poly(mirror([[22.6, 28.8], [28.8, 28.8], [25.7, 34.4]]))), shade: { hi: -2, lo: 0.7 } },
    { id: 'tie', ramp: 'tie', test: U(poly(mirror([[25, 29.4], [26.4, 29.4], [26.9, 35.4], [25.7, 36.9], [24.5, 35.4]]))) },
    // near (left) arm hanging at his side, just in front of the body
    { id: 'sleeveL', ramp: 'sleeve', lineColor: 'sleeveL', test: swingNear(poly(ARM_NEAR.sleeveLong)) },
    { id: 'cuffL', ramp: 'white', test: swingNear(fluffy(ARM_NEAR.cuff[0], ARM_NEAR.cuff[1], 2.6, 1.9, 8, 0.25, 0.7)) },
    { id: 'handL', ramp: 'skin', test: swingNear(ell(...ARM_NEAR.hand)) },
    // white fur stole around the shoulders
    { id: 'stole', ramp: 'white', shade: { hi: -0.7, lo: 0.5 }, test: U((x, y) =>   // a row of puffy cloud lumps
      [[16, 28.6, 3.2], [19.6, 27.6, 3.5], [23.2, 28.4, 3.3], [26.8, 27.6, 3.5], [30.4, 28.4, 3.3], [33.8, 27.8, 3.3], [36.4, 28.8, 2.6]]
        .some(([cx0, cy, r]) => Math.hypot(x - MX(cx0), y - cy) < r)) },
  ],
  hat: ({ U }) => [
    // wide pinstriped hat, tilted up on the right
    { id: 'crown', group: 'hat', ramp: 'hat', test: U(poly([[20.5, 13], [21, 8.6], [24.5, 7.2], [30.5, 7], [33.6, 8.2], [34.4, 12.2]])) },
    { id: 'brim', group: 'hat', ramp: 'hat', test: U(ell(27.5, 13.6, 15.5, 2.5, -0.14)), shade: { hi: -0.3, lo: 0.45 } },
  ],
  decorate: ({ out, is }) => {
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      // pinstripes on the hat crown
      if (is(x, y, 'crown') && out[y * S + x] !== 'hatS' && ((x + Math.round(y * 0.15)) % 3 === 0)) out[y * S + x] = 'stripe';
      // diagonal stripes on the tie
      if (is(x, y, 'tie') && (x + y) % 3 === 0) out[y * S + x] = 'stripe';
    }
  },
  face: ({ put, PX, PY, bob }) => {
    stamp(put, PX(25.3) - 3, PY(22.6) + bob, ['k.....k', '.kkkkk.'], { k: 'ink' });   // a simple smile
  },
  details: ({ put, PX, PY, bob }) => {
    // double-breasted gold buttons
    for (const bx of [21.6, 28.8]) for (const by of [33, 36.5, 40]) stamp(put, PX(MX(bx) - 1.8), PY(by) + bob, ['gG', 'GG'], { g: 'goldL', G: 'gold' });
    // watch chain draped between the button rows
    for (const [x, y] of [[29, 41.6], [28, 42.6], [26.6, 43.2], [25.2, 43.2], [23.8, 42.6], [22.8, 41.6]]) put(PX(MX(x)), PY(y) + bob, 'gold');
    put(PX(MX(24.3)), PY(43.8) + bob, 'goldS');
  },
});

// ---------------------------------------------------------------------
// The rest of the gang: plain round yellow heads (no hair) sitting right down on the collar, a navy vest
// over a sage short-sleeved shirt, and bare yellow forearms.
// ---------------------------------------------------------------------
const GANG_HEAD = { headDy: 1.4, hatSink: 0.5 };   // heads rest on the shoulders, hats sit down on the heads
const gangOutfit = (extra = () => []) => (ctx) => {
  const { U, dy, swingNear, swingFar } = ctx;
  const skinArm = { ramp: 'skin', shade: { hi: -0.9, lo: 0.75 } };
  return [
    // far (right) arm, mostly behind the body
    { id: 'sleeveR', ramp: 'shirt', lineColor: 'shirtD', test: swingFar(poly(ARM_FAR.sleeveShort)) },
    { id: 'armR', ...skinArm, test: swingFar(bareArm(ARM_FAR)) },
    // shirt underneath, then the vest over it (V-neck, sleeveless so the shirt shoulders show)
    { id: 'shirtBody', ramp: 'shirt', lineColor: 'shirtS', test: torso(dy) },
    { id: 'vest', ramp: 'vest', lineColor: 'vestL', test: U(poly(mirror([[19.4, 31], [22.4, 29.8], [25.7, 37.2], [29, 29.8], [31.8, 30.6], [33.2, 32.4],
      [33, 36.4], [32, 40.6], [32.6, 44.6], [18.8, 44.6], [19.6, 40.6], [18.6, 36.4], [18.4, 32.4]]))) },
    { id: 'tie', ramp: 'tie', test: U(poly(mirror([[25.2, 29.6], [26.2, 29.6], [26.6, 34.5], [25.7, 35.8], [24.8, 34.5]]))) },
    ...extra(ctx),
    // near (left) arm hanging at his side, just in front of the body
    { id: 'sleeveL', ramp: 'shirt', lineColor: 'shirtD', test: swingNear(poly(ARM_NEAR.sleeveShort)) },
    { id: 'armL', ...skinArm, test: swingNear(bareArm(ARM_NEAR)) },
  ];
};
// small details every gang vest shares: two vest buttons below the V and a cuff fold on each sleeve
const gangDetails = (more = () => {}) => (ctx) => {
  const { put, putAny, PX, PY, bob, who } = ctx;
  for (const by of [39.6, 42.2]) put(PX(25.7), PY(by) + bob, 'vestL');
  for (const [x0, x1, y] of [ARM_NEAR.fold, ARM_FAR.fold]) {
    for (let x = PX(x0); x <= PX(x1); x++) {
      const py = PY(y) + bob;
      if ((who[py * S + x] || '').startsWith('sleeve')) putAny(x, py, 'shirtS');
    }
  }
  more(ctx);
};

// a strap across the vest down to a bag at the hip (#4's look; #3 and #5 wear variations of it)
const satchel = ({ from, to, strap, bag, box }) => ({ U }) => [
  { id: 'strap', ramp: strap, test: U(strip(mirror([from, to]), 0.55)) },
  { id: 'satchel', ramp: bag, lineColor: bag + 'S', test: U(rrect(...mirrorBox(box), 1)) },
];
const satchelFlap = (box, color) => ({ put, PX, PY, bob }) => {
  const [x0, y0, x1] = mirrorBox(box);
  for (let x = PX(x0 + 0.2); x <= PX(x1 - 0.2); x++) put(x, PY(y0 + 1.8) + bob, color);
};
// a squared-off oval (for the tall fur hat), with a fuzzy edge
const superEll = (cx, cy, rx, ry, amp, k) => (x, y) => {
  const u = (x - cx) / rx, v = (y - cy) / ry;
  return u ** 4 + v ** 4 < 1 + amp * Math.sin(Math.atan2(v, u) * k);
};

ICONS.caporegime = bunnyTaur({

  face: (ctx) => {

      'kkkkkkkkkkkkk',
      '.kgkk...kgkk.',
      '..kk.....kk..',

    stamp(put, cx + 1, PY(23.4) + bob, ['...k', 'kkk.'], { k: 'ink' });   // smirk off to one side

// =====================================================================
// ITEMS: 32×32 icons for snacks and money (what gets tossed onto the field and counted).
// Same palette, outlines and top-left light as everything else. They're collected into
// sprites/items-sheet.png by ATLASES below.
// =====================================================================
const item = draw => ({ size: 32, layout: 32, offset: [0, 0], frames: 1, ms: 0, draw });

// Move, rotate and scale a shape: `test` is written in its own local space around (cx, cy); the result
// draws it rotated by `rot`, scaled by `sc` and shifted by (dx, dy).
const xf = (test, { cx = 16, cy = 16, dx = 0, dy = 0, rot = 0, sc = 1 }) => (x, y) => {
  const vx = (x - cx - dx) / sc, vy = (y - cy - dy) / sc, c = Math.cos(-rot), s = Math.sin(-rot);
  return test(cx + c * vx - s * vy, cy + s * vx + c * vy);
};

// One carrot, drawn pointing straight down in local space (tip at the bottom, leaves on top).
// `t` places it; `p` prefixes the part ids so several carrots can share an icon.
const carrotParts = (t, p = '') => [
  { id: p + 'leafL', group: p + 'leaves', ramp: 'leaf', test: t(ell(13.6, 6, 1.4, 4.2, -0.4)) },
  { id: p + 'leafR', group: p + 'leaves', ramp: 'leaf', test: t(ell(18.4, 6, 1.4, 4.2, 0.4)) },
  { id: p + 'leafM', group: p + 'leaves', ramp: 'leaf', test: t(ell(16, 4.8, 1.4, 4.6, 0)) },
  { id: p + 'carrot', group: p + 'carrot', ramp: 'carrot', shade: { hi: -0.55, lo: 0.4 },
    test: t((x, y) => poly([[11.4, 10.4], [20.6, 10.4], [16.7, 29.4], [15.3, 29.4]])(x, y) || ell(16, 10.6, 4.7, 2.6)(x, y)) },
  // little ridges across the carrot (same group, so no outline around them)
  ...[[13.2, 14.6, 15.6, 14.6], [16.6, 18.4, 18.8, 18.4], [14, 22.2, 15.8, 22.2], [16.4, 25.6, 17.4, 25.6]].map(([x0, y0, x1, y1], i) =>
    ({ id: p + 'ridge' + i, group: p + 'carrot', ramp: 'carrotS', shade: { hi: -9, lo: 9 }, test: t(strip([[x0, y0], [x1, y1]], 0.5)) })),
];

// a tiny hand-placed carrot (6×6) for logos and stamps, where a shrunken carrot shape would just smudge
const tinyCarrot = (put, x, y, o = 'carrot', g = 'leaf') =>
  stamp(put, x, y, ['...g.g', '...gg.', '..oo..', '.oo...', 'oo....', 'o.....'], { o, g });

const ITEM_ICONS = {};

// 🥕 Carrot: tipped over at an angle, leaves up and to the right.
ITEM_ICONS.carrot = item(() => render(carrotParts(test => xf(test, { rot: -0.75, dy: 1 }))));

// 🥕🥕🥕 Carrot bundle: three carrots fanned out from one point near their tops, tied there with a red bow.
ITEM_ICONS.carrotBundle = item(() => {
  // each carrot pivots about the top of its body (local 16, 11), which sits at the tie point
  const fan = [[0.52, 'a'], [-0.52, 'b'], [0, 'c']];   // outer two first, the middle one in front
  const parts = fan.flatMap(([rot, p]) => carrotParts(test => xf(test, { cx: 16, cy: 11, rot, sc: 0.94, dy: -2.4 }), p));
  return render([
    ...parts,
    { id: 'tie', group: 'bow', ramp: 'ribbon', test: strip([[11.8, 10.4], [20.2, 10.4]], 1.1) },
    { id: 'loopL', group: 'bow', ramp: 'ribbon', test: ell(12, 10.2, 2.8, 1.9, -0.3) },
    { id: 'loopR', group: 'bow', ramp: 'ribbon', test: ell(20, 10.2, 2.8, 1.9, 0.3) },
    { id: 'tailL', group: 'bow', ramp: 'ribbon', test: strip([[15.4, 11.2], [13.6, 15.8]], 0.75) },
    { id: 'tailR', group: 'bow', ramp: 'ribbon', test: strip([[16.6, 11.2], [18.6, 15.6]], 0.75) },
    { id: 'knot', ramp: 'ribbonS', shade: { hi: -9, lo: 9 }, test: ell(16, 10.4, 1.6, 1.6) },
  ]);

]));

// 🐾 Rabbit's Foot: two little paw prints
const pawPrint = (p, cx, cy) => [

ITEM_ICONS.rain = item(() => render([
  { id: 'cloud', ramp: 'stone', shade: { hi: -0.5, lo: 0.4 }, test: (x, y) => ell(16, 13, 12, 6)(x, y) || ell(11, 9, 6, 5)(x, y) || ell(20, 8, 6.6, 6)(x, y) },
  ...[[8, 23], [16, 26], [24, 23], [12, 28.6], [20, 28.6]].map(([x, y], i) =>
    ({ id: 'drop' + i, ramp: 'sky', shade: { hi: -9, lo: 9 }, test: strip([[x + 1, y - 2], [x, y]], 0.7) })),
]));

Object.assign(ICONS, ITEM_ICONS);

// =====================================================================
// page
// =====================================================================
function toCanvas(pixels) {
  const c = document.createElement('canvas'); c.width = S; c.height = S;
  const x = c.getContext('2d');
  pixels.forEach((k, i) => { if (k) { x.fillStyle = PAL[k]; x.fillRect(i % S, (i / S) | 0, 1, 1); } });
  return c;
}
function scaled(src, scale, cls) {
  const c = document.createElement('canvas'); c.width = S * scale; c.height = S * scale; c.className = cls;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(src, 0, 0, c.width, c.height);
  return c;
}

// An icon is either a function (static) or { frames, ms, draw(f) } (animated).
// Saves <name>.png (frame 0, the static icon) and, if animated, <name>-idle.png (all frames in a row).
const post = (file, canvas) => new Promise(res => canvas.toBlob(async b =>
  res((await fetch(`/save/${file}`, { method: 'POST', body: b })).ok), 'image/png'));

const built = {};
for (const [name, def] of Object.entries(ICONS)) {
  const icon = typeof def === 'function' ? { frames: 1, ms: 0, draw: def } : def;
  S = icon.size || 64; K = S / (icon.layout || 64); [OX, OY] = icon.offset || [0, 0];
  const frames = [...Array(icon.frames)].map((_, f) => toCanvas(icon.draw(f)));
  const strip = document.createElement('canvas'); strip.width = S * frames.length; strip.height = S;
  frames.forEach((c, i) => strip.getContext('2d').drawImage(c, i * S, 0));
  built[name] = { icon, frames, strip };

  const row = document.createElement('div'); row.className = 'row';
  const big = document.createElement('div'); big.className = 'card';
  big.innerHTML = `<h2>${name}, ${S}×${S}${icon.frames > 1 ? `, idle ${icon.frames} frames` : ''} (6×)</h2>`;
  const bigC = scaled(frames[0], 6, 'checker'); big.appendChild(bigC);
  const small = document.createElement('div'); small.className = 'card';
  small.innerHTML = `<h2>In game (1× and 2×, on the path and grass)</h2>`;
  const fl = document.createElement('div'); fl.className = 'flex';
  const smalls = [scaled(frames[0], 1, 'path'), scaled(frames[0], 2, 'path'), scaled(frames[0], 1, 'field')];
  fl.append(...smalls); small.appendChild(fl);
  row.append(big, small);

  if (icon.frames > 1) {
    let f = 0;
    setInterval(() => {
      f = (f + 1) % frames.length;
      for (const c of [bigC, ...smalls]) {
        const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
        x.clearRect(0, 0, c.width, c.height); x.drawImage(frames[f], 0, 0, c.width, c.height);
      }
    }, icon.ms);
    const st = document.createElement('div'); st.className = 'card';
    st.innerHTML = `<h2>Frames (2×)</h2>`;
    const sc = document.createElement('canvas'); sc.width = strip.width * 2; sc.height = S * 2; sc.className = 'checker';
    const sx = sc.getContext('2d'); sx.imageSmoothingEnabled = false; sx.drawImage(strip, 0, 0, sc.width, sc.height);
    st.appendChild(sc);
    const r2 = document.createElement('div'); r2.className = 'row'; r2.appendChild(st);
    document.getElementById('icons').append(row, r2);
  } else {
    document.getElementById('icons').appendChild(row);
  }

  const exp = document.createElement('div'); exp.className = 'card';
  exp.innerHTML = `<h2>Export</h2><button>Save</button> <span style="color:#7ee0a1"></span>`;
  exp.querySelector('button').onclick = async () =>
    exp.querySelector('span').textContent = (await saveIcon(name)) ? 'Saved' : 'Save failed';
  row.appendChild(exp);
}
window.saveIcon = async name => {
  const b = built[name];
  const ok1 = await post(`${name}.png`, b.frames[0]);
  const ok2 = b.icon.frames > 1 ? await post(`${name}-idle.png`, b.strip) : true;
  return ok1 && ok2;
};

// ---------- combined sheets: one row per variant, each row is that variant's idle frames ----------
const SHEETS = {
  'farmer-sheet': ['mafioso', 'caporegime', 'contractee', 'consigliere', 'soldier'],   // rows 0-4
};
const sheets = {};
for (const [file, names] of Object.entries(SHEETS)) {
  const rows = names.map(n => built[n]);
  const fw = rows[0].frames[0].width, cols = Math.max(...rows.map(r => r.frames.length));
  const c = document.createElement('canvas'); c.width = fw * cols; c.height = fw * rows.length;
  rows.forEach((r, i) => c.getContext('2d').drawImage(r.strip, 0, i * fw));
  const meta = {
    image: `${file}.png`, frameWidth: fw, frameHeight: fw,
    rows: Object.fromEntries(names.map((n, i) => [n, { row: i, frames: rows[i].frames.length, ms: rows[i].icon.ms }])),
  };
  sheets[file] = { canvas: c, meta };

  const row = document.createElement('div'); row.className = 'row';
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = `<h2>${file}.png: ${names.length} rows × ${cols} frames, ${fw}×${fw} each (2×)</h2>`;
  const big = document.createElement('canvas'); big.width = c.width * 2; big.height = c.height * 2; big.className = 'checker';
  const bx = big.getContext('2d'); bx.imageSmoothingEnabled = false; bx.drawImage(c, 0, 0, big.width, big.height);
  const exp = document.createElement('div');
  exp.innerHTML = `<button>Save ${file}.png + .json</button> <span style="color:#7ee0a1"></span>`;
  exp.querySelector('button').onclick = async () =>
    exp.querySelector('span').textContent = (await saveSheet(file)) ? 'Saved' : 'Save failed';
  card.append(big, exp); row.appendChild(card);
  document.getElementById('icons').prepend(row);
}
window.saveSheet = async file => {
  const { canvas, meta } = sheets[file];
  const ok1 = await post(`${file}.png`, canvas);
  const ok2 = (await fetch(`/save/${file}.json`, { method: 'POST', body: JSON.stringify(meta, null, 2) })).ok;
  return ok1 && ok2;
};

// ---------- atlases: still icons packed into a grid, with a json index of where each one is ----------
const ATLASES = {
  'items-sheet': { names: Object.keys(ITEM_ICONS), cols: 8 },
};
const atlases = {};
for (const [file, { names, cols }] of Object.entries(ATLASES)) {
  const fw = built[names[0]].frames[0].width, rows = Math.ceil(names.length / cols);
  const c = document.createElement('canvas'); c.width = fw * cols; c.height = fw * rows;
  const icons = {};
  names.forEach((n, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    c.getContext('2d').drawImage(built[n].frames[0], col * fw, row * fw);
    icons[n] = { col, row };
  });
  atlases[file] = { canvas: c, meta: { image: `${file}.png`, frameWidth: fw, frameHeight: fw, icons } };

  const row = document.createElement('div'); row.className = 'row';
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = `<h2>${file}.png: ${names.length} icons, ${fw}×${fw} each (4×, and 1× on the grass)</h2>`;
  const big = document.createElement('canvas'); big.width = c.width * 4; big.height = c.height * 4; big.className = 'checker';
  const bx = big.getContext('2d'); bx.imageSmoothingEnabled = false; bx.drawImage(c, 0, 0, big.width, big.height);
  const small = document.createElement('canvas'); small.width = c.width; small.height = c.height; small.className = 'field';
  small.getContext('2d').drawImage(c, 0, 0);
  const exp = document.createElement('div');
  exp.innerHTML = `<button>Save ${file}.png + .json</button> <span style="color:#7ee0a1"></span>`;
  exp.querySelector('button').onclick = async () =>
    exp.querySelector('span').textContent = (await saveAtlas(file)) ? 'Saved' : 'Save failed';
  card.append(big, small, exp); row.appendChild(card);
  document.getElementById('icons').prepend(row);
}
window.saveAtlas = async file => {
  const { canvas, meta } = atlases[file];
  const ok1 = await post(`${file}.png`, canvas);
  const ok2 = (await fetch(`/save/${file}.json`, { method: 'POST', body: JSON.stringify(meta, null, 2) })).ok;
  return ok1 && ok2;
};
</script>
